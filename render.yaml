services:
  - type: web
    name: fsffl-next-beta
    runtime: python
    plan: free
    buildCommand: python -m pip install -e '.[web]'
    startCommand: uvicorn fsffl.product.webapp:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FSFFL_BETA_AUTH
        value: "1"
      - key: FSFFL_BETA_USERNAME
        sync: false
      - key: FSFFL_BETA_PASSWORD
        sync: false
