services:
  - type: web
    name: fsffl-next-beta
    runtime: python
    plan: free
    buildCommand: python -m pip install -e '.[web]'
    startCommand: uvicorn fsffl.product.persistent_webapp:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FSFFL_BETA_AUTH
        value: "1"
      - key: FSFFL_BETA_USERNAME
        sync: false
      - key: FSFFL_BETA_PASSWORD
        sync: false
      - key: FSFFL_DATABASE_URL
        sync: false

  - type: cron
    name: fsffl-next-annual-preseason-snapshot
    runtime: python
    plan: starter
    buildCommand: python -m pip install -e .
    startCommand: python scripts/run_annual_preseason_scheduler_tick.py
    schedule: "17 8 * * *"
    envVars:
      - key: FSFFL_ANNUAL_SNAPSHOT_ENDPOINT
        value: "https://fsffl-next-private-beta.onrender.com/internal/annual-preseason-snapshot/capture"
      - key: FSFFL_SCHEDULER_TOKEN
        sync: false
