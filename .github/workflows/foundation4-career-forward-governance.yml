name: Foundation 4 Career-Forward Governance Research

on:
  push:
    branches: [research/foundation4-career-forward-tail-aggregation-20261002]
    paths:
      - scripts/run_foundation4_career_forward_governance.py
      - docs/operations/directives/20261002_FOUNDATION4_CAREER_FORWARD_GOVERNANCE.md
      - .github/workflows/foundation4-career-forward-governance.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install governed research dependencies
        run: python -m pip install -e . pandas numpy scikit-learn tabulate
      - name: Restore frozen research implementation and inputs
        run: |
          mkdir -p /tmp/panel /tmp/term
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${{ github.repository }}/contents/scripts/run_intrinsic_comprehensive_development.py?ref=research/intrinsic-comprehensive-y4-y8-20260926" \
            > /tmp/intrinsic_comprehensive_development.py
          gh api repos/${{ github.repository }}/actions/artifacts/10912862252/zip > /tmp/panel.zip
          unzip -oq /tmp/panel.zip -d /tmp/panel
          gh api repos/${{ github.repository }}/actions/artifacts/10899387479/zip > /tmp/term.zip
          unzip -oq /tmp/term.zip -d /tmp/term
      - name: Run frozen career-forward tail / aggregation study
        run: |
          python scripts/run_foundation4_career_forward_governance.py \
            --development-module /tmp/intrinsic_comprehensive_development.py \
            --model-a-rows /tmp/term/frozen/modela/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results /tmp/term/frozen/qb/qb_career_state_deployment_results.json \
            --raw-seasons /tmp/panel/RAW_PLAYER_SEASONS_RICH.csv \
            --players /tmp/panel/PLAYERS.csv \
            --residual-states /tmp/term/frozen/modela/multiyear-intrinsic-model-a/player_specific_trajectory_residual_states.csv \
            --innovation-states /tmp/term/frozen/modela/multiyear-intrinsic-model-a/within_player_trajectory_innovation_states.csv
      - name: Upload governed research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation4-career-forward-governance
          path: artifacts/research/foundation4_career_forward_20261002/*
          retention-days: 14
