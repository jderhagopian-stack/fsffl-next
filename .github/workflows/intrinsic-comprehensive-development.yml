name: Intrinsic Comprehensive Development Selection
on:
  push:
    branches: [research/intrinsic-comprehensive-y4-y8-20260926]
    paths:
      - scripts/run_intrinsic_comprehensive_development.py
      - .github/workflows/intrinsic-comprehensive-development.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install -e . pandas numpy scikit-learn
      - name: Restore governed historical inputs
        run: |
          mkdir -p /tmp/panel /tmp/term artifacts/research/intrinsic_comprehensive_y4_y8_20260926
          gh api repos/${{ github.repository }}/actions/artifacts/10912862252/zip > /tmp/panel.zip
          unzip -oq /tmp/panel.zip -d /tmp/panel
          gh api repos/${{ github.repository }}/actions/artifacts/10899387479/zip > /tmp/term.zip
          unzip -oq /tmp/term.zip -d /tmp/term
      - name: Run nested development selection with final holdout sealed
        run: |
          python scripts/run_intrinsic_comprehensive_development.py \
            --model-a-rows /tmp/term/frozen/modela/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results /tmp/term/frozen/qb/qb_career_state_deployment_results.json \
            --raw-seasons /tmp/panel/RAW_PLAYER_SEASONS_RICH.csv \
            --players /tmp/panel/PLAYERS.csv \
            --residual-states /tmp/term/frozen/modela/multiyear-intrinsic-model-a/player_specific_trajectory_residual_states.csv \
            --innovation-states /tmp/term/frozen/modela/multiyear-intrinsic-model-a/within_player_trajectory_innovation_states.csv
      - name: Upload frozen development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intrinsic-comprehensive-development-selection
          path: |
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/PIT_FEATURE_PROVENANCE.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FEATURE_SET_MATRIX.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FEATURE_GROUP_DEVELOPMENT_ABLATIONS.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/DEVELOPMENT_MODEL_MATRIX.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/DEVELOPMENT_FOLD_STABILITY.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/DEVELOPMENT_SPECIALIST_ROUTE.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/DEVELOPMENT_ARCHITECTURE_COMPARISON.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FROZEN_ARCHITECTURE_CANDIDATE.json
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/DATA_GAPS.md
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/DEVELOPMENT_SELECTION.md
          retention-days: 14
