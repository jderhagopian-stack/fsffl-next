name: Research Shapley Precision Target Decomposition

on:
  pull_request:
    branches: [research/deployment-shapley-holding]
    paths:
      - 'scripts/run_shapley_precision_target_decomposition.py'
      - 'artifacts/research/shapley_precision_target_protocol.md'
      - '.github/workflows/shapley-precision-target-decomposition.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Build PIT football career panel
        run: Rscript scripts/extract_career_transition_panel.R
      - name: Download frozen PIT Forecast evidence
        run: |
          mkdir -p artifacts/shapley-decomp/frozen-pr131 artifacts/shapley-decomp/frozen-qb
          gh api repos/${{ github.repository }}/actions/artifacts/10318004415/zip > /tmp/pr131.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10317272576/zip > /tmp/qb.zip
          unzip -q /tmp/pr131.zip -d artifacts/shapley-decomp/frozen-pr131
          unzip -q /tmp/qb.zip -d artifacts/shapley-decomp/frozen-qb
      - name: Download frozen PR 139 Shapley evidence
        run: |
          mkdir -p artifacts/shapley-decomp/pr139
          gh api repos/${{ github.repository }}/actions/artifacts/10380269603/zip > /tmp/pr139.zip
          unzip -q /tmp/pr139.zip -d artifacts/shapley-decomp/pr139
      - name: Run precision and target decomposition study
        run: |
          mkdir -p artifacts/shapley-decomp/results
          python scripts/run_shapley_precision_target_decomposition.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/shapley-decomp/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/shapley-decomp/frozen-qb/qb_career_state_deployment_results.json \
            --frozen-pr139-rows artifacts/shapley-decomp/pr139/deployment-shapley/results/deployment_shapley_historical_rows.json \
            --output-dir artifacts/shapley-decomp/results
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shapley-precision-target-decomposition
          path: |
            artifacts/shapley-decomp/results/*.json
            artifacts/research/shapley_precision_target_protocol.md
            artifacts/next2-career/career_transition_coverage.csv
          retention-days: 14
