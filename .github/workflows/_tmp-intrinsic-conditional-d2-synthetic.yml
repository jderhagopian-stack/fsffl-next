name: Temporary Intrinsic Conditional D2 Synthetic

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_intrinsic_conditional_quality_synthetic.py'
      - '.github/workflows/_tmp-intrinsic-conditional-d2-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic gates
        run: python scripts/run_intrinsic_conditional_quality_synthetic.py
      - uses: actions/upload-artifact@v4
        with:
          name: intrinsic-conditional-d2-synthetic
          path: artifacts/conditional-d2-synthetic/conditional_d2_synthetic.json
          retention-days: 30
