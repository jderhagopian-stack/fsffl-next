name: CI

# PR updates get focused validation only. The stable-head full suite is triggered
# when a merge-ready PR is marked ready for review; see OPERATING_PROTOCOL.md.
on:
  pull_request:

# Superseded focused runs should not compete with the latest PR head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,web]'
      - name: Focused Dynasty and Tranche A persistence regressions
        run: pytest -q tests/test_dynasty_presentation_handoff.py tests/test_postgres_connection_pool.py tests/test_persistence_metadata_reads.py tests/test_market_batch_persistence.py tests/test_persistence_contracts.py tests/test_atomic_intelligence_publication.py tests/test_storage_foundation_poc.py
