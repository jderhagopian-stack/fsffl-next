name: CI

# Pull-request CI is the stable merge gate; avoid a repeated full suite on merge push.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,web]'
      - name: Focused Dynasty readiness regressions
        run: pytest -q tests/test_dynasty_presentation_handoff.py
      - name: Stable merge gate full suite
        run: pytest -q
