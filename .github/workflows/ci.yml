name: CI

# PR updates get focused validation only. The stable-head full suite is triggered
# when a merge-ready PR is marked ready for review; see OPERATING_PROTOCOL.md.
on:
  pull_request:

# Superseded focused runs should not compete with the latest PR head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,web]'
      - name: Install dynamic-candidate test dependency
        run: python -m pip install 'pandas>=2.2,<3'
      - name: Focused Dynasty, persistence, provider, and Career regressions
        run: pytest -q tests/test_dynasty_presentation_handoff.py tests/test_postgres_connection_pool.py tests/test_persistence_metadata_reads.py tests/test_market_batch_persistence.py tests/test_persistence_contracts.py tests/test_atomic_intelligence_publication.py tests/test_preseason_forecast_baseline.py tests/test_preseason_baseline_read_through.py tests/test_provider_acquisition_telemetry.py tests/test_provider_sleeper_live.py tests/test_sleeper_live_parallel_acquisition.py tests/test_cbs_live.py tests/test_fftoday_live.py tests/test_nfl_fantasy_live.py tests/test_in_season_projection_sources.py tests/test_career_coverage.py tests/test_foundation4_dynamic_candidates.py tests/test_career_forward_intrinsic.py tests/test_shapley_intrinsic_contract.py tests/test_foundation4_career_forward_runtime.py
