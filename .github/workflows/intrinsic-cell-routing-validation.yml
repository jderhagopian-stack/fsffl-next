name: Intrinsic Cell Routing Rolling Validation
on:
  push:
    branches: [research/intrinsic-cell-routing-y4-y8-20260926]
    paths:
      - scripts/run_intrinsic_cell_routing_validation.py
      - artifacts/research/intrinsic_cell_routing_y4_y8_20260926/CELL_ROUTING_POLICY_FREEZE.json
      - .github/workflows/intrinsic-cell-routing-validation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rolling-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install -e . pandas numpy scikit-learn
      - name: Restore governed historical inputs only
        run: |
          mkdir -p /tmp/panel /tmp/term
          gh api repos/${{ github.repository }}/actions/artifacts/10912862252/zip > /tmp/panel.zip
          unzip -oq /tmp/panel.zip -d /tmp/panel
          gh api repos/${{ github.repository }}/actions/artifacts/10899387479/zip > /tmp/term.zip
          unzip -oq /tmp/term.zip -d /tmp/term
      - name: Run frozen general routing policy with repeated rolling origins
        run: |
          python scripts/run_intrinsic_cell_routing_validation.py \
            --policy-freeze artifacts/research/intrinsic_cell_routing_y4_y8_20260926/CELL_ROUTING_POLICY_FREEZE.json \
            --prior-architecture-freeze artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FROZEN_ARCHITECTURE_CANDIDATE.json \
            --model-a-rows /tmp/term/frozen/modela/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results /tmp/term/frozen/qb/qb_career_state_deployment_results.json \
            --raw-seasons /tmp/panel/RAW_PLAYER_SEASONS_RICH.csv \
            --players /tmp/panel/PLAYERS.csv \
            --residual-states /tmp/term/frozen/modela/multiyear-intrinsic-model-a/player_specific_trajectory_residual_states.csv \
            --innovation-states /tmp/term/frozen/modela/multiyear-intrinsic-model-a/within_player_trajectory_innovation_states.csv
      - name: Upload rolling validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intrinsic-cell-routing-rolling-validation
          path: |
            artifacts/research/intrinsic_cell_routing_y4_y8_20260926/ROLLING_ROUTE_DECISIONS.csv
            artifacts/research/intrinsic_cell_routing_y4_y8_20260926/ROLLING_CANDIDATE_SELECTION_SCORES.csv
            artifacts/research/intrinsic_cell_routing_y4_y8_20260926/ROLLING_POLICY_PREDICTIONS.csv
            artifacts/research/intrinsic_cell_routing_y4_y8_20260926/ROLLING_POLICY_CELL_METRICS.csv
            artifacts/research/intrinsic_cell_routing_y4_y8_20260926/ROLLING_POLICY_OUTER_FOLD_METRICS.csv
            artifacts/research/intrinsic_cell_routing_y4_y8_20260926/ROLLING_POLICY_CELL_SCORES.csv
            artifacts/research/intrinsic_cell_routing_y4_y8_20260926/CELL_ROUTING_INTERPRETATION.csv
            artifacts/research/intrinsic_cell_routing_y4_y8_20260926/ROUTING_POLICY_AGGREGATE.csv
            artifacts/research/intrinsic_cell_routing_y4_y8_20260926/CURRENT_RESEARCH_ROUTE.csv
            artifacts/research/intrinsic_cell_routing_y4_y8_20260926/OUTER_ORIGIN_PLAN.json
            artifacts/research/intrinsic_cell_routing_y4_y8_20260926/ROLLING_VALIDATION_RESULT.json
          retention-days: 14
