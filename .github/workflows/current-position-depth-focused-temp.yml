name: Current Position Depth focused temporary

on:
  push:
    branches:
      - work/current-position-depth-correction-20261006

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev,web]'
      - name: Check League Atlas JavaScript syntax
        run: node --check src/fsffl/product/static/league_comparison.js
      - name: Focused Current Position and Depth regressions
        run: >
          pytest -q
          tests/test_current_position_depth.py
          tests/test_in_season_forecast.py
          tests/test_forecast_lineup_analytics.py
          tests/test_league_relative_position_strength.py
          tests/test_product_league_comparison_static.py
          tests/test_product_league_structure.py
          tests/test_phase3_league_surface.py
          tests/test_readiness_progress_truth_static.py
          tests/test_presentation_continuity.py
          tests/test_provisional_k_dst_forecast.py
