name: Intrinsic Comprehensive Evidence Inventory
on:
  push:
    branches: [research/intrinsic-comprehensive-y4-y8-20260926]
    paths:
      - scripts/inventory_intrinsic_comprehensive_evidence.R
      - .github/workflows/intrinsic-comprehensive-evidence-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Inventory governed PIT evidence
        run: Rscript scripts/inventory_intrinsic_comprehensive_evidence.R
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: intrinsic-comprehensive-evidence-inventory
          path: artifacts/research/intrinsic_comprehensive_y4_y8_20260926/*
          retention-days: 14
