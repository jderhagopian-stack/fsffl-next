name: Temporary Intrinsic v6 Current Nonlinear Sanity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_tmp_intrinsic_v6_current_nonlinear_sanity.py'
      - '.github/workflows/_tmp-intrinsic-v6-current-nonlinear-sanity.yml'

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Run current nonlinear Intrinsic sanity
        run: python scripts/_tmp_intrinsic_v6_current_nonlinear_sanity.py
      - name: Upload sanity artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-intrinsic-v6-nonlinear-sanity
          path: artifacts/current-intrinsic-sanity/*.json
          retention-days: 7
