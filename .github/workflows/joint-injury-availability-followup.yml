name: Joint Injury Availability Follow-up Research

on:
  push:
    branches: [research/joint-injury-availability-20260927]
    paths:
      - scripts/run_joint_injury_availability_followup.py
      - artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_PROTOCOL.md
      - artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_GATES.md
      - .github/workflows/joint-injury-availability-followup.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: python -m pip install -e . pandas numpy scikit-learn

      - name: Restore governed injury episode artifact
        run: |
          mkdir -p /tmp/injury_hist
          gh api repos/${{ github.repository }}/actions/artifacts/10921183161/zip > /tmp/injury_hist.zip
          unzip -oq /tmp/injury_hist.zip -d /tmp/injury_hist

      - name: Restore exact separate-model benchmark artifact
        run: |
          mkdir -p /tmp/prior_injury_validation
          gh api repos/${{ github.repository }}/actions/artifacts/10933510516/zip > /tmp/prior_injury_validation.zip
          unzip -oq /tmp/prior_injury_validation.zip -d /tmp/prior_injury_validation

      - name: Build governed career panel for PIT age and NFL experience
        run: |
          git clone --quiet --no-checkout https://github.com/${{ github.repository }}.git /tmp/research_ref
          cd /tmp/research_ref
          git checkout --quiet c12402df1b7fa0bfbb3d994bdcf791d80e103a0c -- scripts/extract_career_transition_panel.R
          Rscript scripts/extract_career_transition_panel.R

      - name: Score frozen joint injury-availability architecture
        run: |
          python scripts/run_joint_injury_availability_followup.py \
            --episodes /tmp/injury_hist/INJURY_EPISODES.csv \
            --career-panel /tmp/research_ref/artifacts/next2-career/career_transition_panel.csv \
            --prior-dir /tmp/prior_injury_validation

      - name: Persist compact joint-study evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_FOLD_METRICS.csv \
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_RETURN_POOLED_METRICS.csv \
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_POOLED_METRICS.csv \
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_RETURN_POSITION_SAFETY.csv \
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_POSITION_SAFETY.csv \
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_CONFORMAL_SUMMARY.csv \
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_RESULT.json
          git commit -m "Research: persist joint injury-availability scoring" || exit 0
          git push origin HEAD:research/joint-injury-availability-20260927

      - name: Upload complete joint-study evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-injury-availability-followup-research
          path: |
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_FOLD_METRICS.csv
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_RETURN_POOLED_METRICS.csv
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_POOLED_METRICS.csv
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_RETURN_POSITION_SAFETY.csv
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_POSITION_SAFETY.csv
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_CONFORMAL_SUMMARY.csv
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_CONFORMAL_PREDICTIONS.csv
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_RETURN_OOT_PREDICTIONS.csv
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_OOT_PREDICTIONS.csv
            artifacts/research/current_football_state_h3_20260926/JOINT_INJURY_AVAILABILITY_RESULT.json
          retention-days: 30
