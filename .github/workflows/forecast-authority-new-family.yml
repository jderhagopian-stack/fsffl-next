name: Forecast Authority Bounded New-Family Audit

on:
  push:
    branches: [research/forecast-model-authority-audit-20260927]
    paths:
      - scripts/run_forecast_authority_new_family.py
      - artifacts/research/forecast_model_authority_audit_20260927/AUDIT_PROTOCOL.md
      - artifacts/research/forecast_model_authority_audit_20260927/BREADTH_DECISION_PRE_SCORE.md
      - .github/workflows/forecast-authority-new-family.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install -e . pandas numpy scipy scikit-learn
      - name: Restore exact frozen redevelopment code and panel extractor
        run: |
          git fetch origin research/future-state-resolution-phase34-resume
          git show origin/research/future-state-resolution-phase34-resume:artifacts/research/production_resolution/reproducible_forecast_redevelopment_20260919/redevelopment_v1.py > /tmp/redevelopment_v1.py
          git show origin/research/future-state-resolution-phase34-resume:scripts/extract_career_transition_panel.R > /tmp/extract_career_transition_panel.R
          sha256sum /tmp/redevelopment_v1.py /tmp/extract_career_transition_panel.R
      - name: Restore exact governed Phase-2 PIT panel
        run: |
          mkdir -p /tmp/phase2
          gh api repos/${{ github.repository }}/actions/artifacts/10486530017/zip > /tmp/phase2.zip
          unzip -oq /tmp/phase2.zip -d /tmp/phase2
          find /tmp/phase2 -maxdepth 5 -type f | sort
      - name: Score frozen bounded family slate
        run: |
          PANEL=$(find /tmp/phase2 -iname '*player*season*panel*.csv' -print -quit)
          test -n "$PANEL"
          python scripts/run_forecast_authority_new_family.py \
            --career-panel "$PANEL" \
            --redevelopment-code /tmp/redevelopment_v1.py \
            --output-dir artifacts/research/forecast_model_authority_audit_20260927/new_family
      - name: Persist compact scoring evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/research/forecast_model_authority_audit_20260927/new_family/NEW_FAMILY_SYMMETRIC_SUMMARY.csv \
            artifacts/research/forecast_model_authority_audit_20260927/new_family/NEW_FAMILY_ORIGIN_METRICS.csv \
            artifacts/research/forecast_model_authority_audit_20260927/new_family/NEW_FAMILY_PAIRWISE_UNCERTAINTY.csv \
            artifacts/research/forecast_model_authority_audit_20260927/new_family/NEW_FAMILY_RESULT.json
          git commit -m "Research: persist bounded Forecast family scoring" || exit 0
          git push origin HEAD:research/forecast-model-authority-audit-20260927
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-authority-new-family
          path: |
            artifacts/research/forecast_model_authority_audit_20260927/new_family/
          retention-days: 30
