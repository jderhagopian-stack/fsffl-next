name: Intrinsic Comprehensive Final Holdout
on:
  push:
    branches: [research/intrinsic-comprehensive-y4-y8-20260926]
    paths:
      - scripts/run_intrinsic_comprehensive_final_holdout.py
      - artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FROZEN_ARCHITECTURE_CANDIDATE.json
      - .github/workflows/intrinsic-comprehensive-final-holdout.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  final-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install -e . pandas numpy scikit-learn
      - name: Restore governed historical inputs
        run: |
          mkdir -p /tmp/panel /tmp/term
          gh api repos/${{ github.repository }}/actions/artifacts/10912862252/zip > /tmp/panel.zip
          unzip -oq /tmp/panel.zip -d /tmp/panel
          gh api repos/${{ github.repository }}/actions/artifacts/10899387479/zip > /tmp/term.zip
          unzip -oq /tmp/term.zip -d /tmp/term
      - name: Score untouched final holdout from frozen architecture
        run: |
          python scripts/run_intrinsic_comprehensive_final_holdout.py \
            --freeze artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FROZEN_ARCHITECTURE_CANDIDATE.json \
            --model-a-rows /tmp/term/frozen/modela/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results /tmp/term/frozen/qb/qb_career_state_deployment_results.json \
            --raw-seasons /tmp/panel/RAW_PLAYER_SEASONS_RICH.csv \
            --players /tmp/panel/PLAYERS.csv \
            --residual-states /tmp/term/frozen/modela/multiyear-intrinsic-model-a/player_specific_trajectory_residual_states.csv \
            --innovation-states /tmp/term/frozen/modela/multiyear-intrinsic-model-a/within_player_trajectory_innovation_states.csv
      - name: Upload final holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intrinsic-comprehensive-final-holdout
          path: |
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FINAL_HOLDOUT_PREDICTIONS.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FINAL_HOLDOUT_FALLBACK_PREDICTIONS.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FINAL_HOLDOUT_CELL_METRICS.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FINAL_HOLDOUT_UNCERTAINTY.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FINAL_HOLDOUT_ECONOMIC_BRIDGE.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FINAL_HOLDOUT_MISSINGNESS.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/EFFECTIVE_UNCERTAINTY_CONTRACT.csv
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FINAL_HOLDOUT_DECISION.json
            artifacts/research/intrinsic_comprehensive_y4_y8_20260926/FINAL_HOLDOUT_REPORT.md
          retention-days: 14
