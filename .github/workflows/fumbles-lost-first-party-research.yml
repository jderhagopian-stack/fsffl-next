name: FUMBLES_LOST First-Party Research
on:
  push:
    branches: [research/fumbles-first-party-20260926]
    paths:
      - scripts/run_fumbles_lost_first_party_research.py
      - .github/workflows/fumbles-lost-first-party-research.yml
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run chronological first-party FUMBLES_LOST study
        run: python scripts/run_fumbles_lost_first_party_research.py
      - name: Upload governed research outputs
        uses: actions/upload-artifact@v4
        with:
          name: fumbles-lost-first-party-research
          path: artifacts/fumbles-lost-first-party-research/*
          retention-days: 14
      - name: Persist final research evidence on branch
        run: |
          rm -rf artifacts/research/fumbles_lost_first_party_model_20260926
          mkdir -p artifacts/research/fumbles_lost_first_party_model_20260926
          cp artifacts/fumbles-lost-first-party-research/VALIDATION_RESULTS.json artifacts/research/fumbles_lost_first_party_model_20260926/
          cp artifacts/fumbles-lost-first-party-research/OOT_METRICS.csv artifacts/research/fumbles_lost_first_party_model_20260926/
          cp artifacts/fumbles-lost-first-party-research/COLD_START_STRESS.csv artifacts/research/fumbles_lost_first_party_model_20260926/
          cp artifacts/fumbles-lost-first-party-research/CALIBRATION.csv artifacts/research/fumbles_lost_first_party_model_20260926/
          cp artifacts/fumbles-lost-first-party-research/CURRENT_SHADOWS.csv artifacts/research/fumbles_lost_first_party_model_20260926/
          cp artifacts/fumbles-lost-first-party-research/DATA_LINEAGE.json artifacts/research/fumbles_lost_first_party_model_20260926/
          cp artifacts/fumbles-lost-first-party-research/REPORT.md artifacts/research/fumbles_lost_first_party_model_20260926/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/research/fumbles_lost_first_party_model_20260926
          if ! git diff --cached --quiet; then
            git commit -m "Research: persist first-party FUMBLES_LOST evidence"
            git push
          fi
