name: Temporary Intrinsic Synthetic Follow-up

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_tmp_intrinsic_synthetic_followup.py'
      - '.github/workflows/_tmp-intrinsic-synthetic-followup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/_tmp_intrinsic_synthetic_followup.py
      - uses: actions/upload-artifact@v4
        with:
          name: intrinsic-three-way-synthetic-followup
          path: artifacts/intrinsic-synthetic-followup/intrinsic_three_way_synthetic_followup.json
          retention-days: 7
