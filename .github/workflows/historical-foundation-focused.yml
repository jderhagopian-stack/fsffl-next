name: Historical PIT foundation focused (research only)

on:
  pull_request:
    paths:
      - 'src/fsffl/state/historical_coverage.py'
      - 'tests/test_historical_coverage.py'
      - 'docs/operations/workstreams/HISTORICAL_INTELLIGENCE_FOUNDATION_20261101.md'
      - '.github/workflows/historical-foundation-focused.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Use governed Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install local core and tests only
        run: python -m pip install -e '.[dev]'
      - name: Run historical cutoff matrix and existing State/Trade regressions
        run: python -m pytest -q tests/test_historical_coverage.py tests/test_historical_trade_state.py tests/test_state_postgres_history.py tests/test_state_foundation.py
