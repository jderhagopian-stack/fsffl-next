name: Temporary Current Intrinsic Sanity

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_tmp_current_intrinsic_sanity.py'
      - '.github/workflows/_tmp-current-intrinsic-sanity.yml'

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,web]'
      - name: Run focused Fundamental Intrinsic tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q tests/test_fundamental_intrinsic_v2.py tests/test_intrinsic_value_product_experience.py 2>&1 | tee focused_intrinsic_tests.txt
      - name: Run full test suite evidence
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee full_ci_tests.txt
      - name: Run current-player sanity validation
        shell: bash
        run: |
          set -o pipefail
          python scripts/_tmp_current_intrinsic_sanity.py 2>&1 | tee current_intrinsic_sanity.md
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: intrinsic-final-validation
          path: |
            focused_intrinsic_tests.txt
            full_ci_tests.txt
            current_intrinsic_sanity.md
          retention-days: 14
