name: Temporary Current Intrinsic Sanity
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_tmp_current_intrinsic_sanity.py'
      - 'src/fsffl/value/intrinsic_v2.py'
      - 'tests/test_fundamental_intrinsic_v2.py'
      - '.github/workflows/_tmp-current-intrinsic-sanity.yml'
permissions:
  contents: read
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev,web]'
      - name: Current player values
        run: python scripts/_tmp_current_intrinsic_sanity.py
      - name: Focused tests
        run: pytest -q tests/test_fundamental_intrinsic_v2.py tests/test_intrinsic_value_product_experience.py