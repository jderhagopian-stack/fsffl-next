name: Temporary Current Intrinsic Sanity

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_tmp_current_intrinsic_sanity.py'
      - '.github/workflows/_tmp-current-intrinsic-sanity.yml'

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/_tmp_current_intrinsic_sanity.py
