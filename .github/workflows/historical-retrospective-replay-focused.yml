name: Historical retrospective replay - provider adapter (nonproduction)
on:
  pull_request:
    paths:
      - 'src/fsffl/state/retrospective_sleeper_replay.py'
      - 'tests/test_retrospective_sleeper_replay.py'
      - 'tests/test_retrospective_archived_2023_private.py'
      - 'scripts/replay_retrospective_sleeper_archive.py'
      - '.github/workflows/historical-retrospective-replay-focused.yml'
      - 'docs/operations/workstreams/HISTORICAL_REAL_TRADE_REPLAY_20261101.md'
permissions:
  contents: read
jobs:
  provider-fact-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact PR head checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install local project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run source-adapter and affected historical State/Trade regressions
        run: python -m pytest -q tests/test_retrospective_sleeper_replay.py tests/test_retrospective_archived_2023_private.py tests/test_historical_coverage.py tests/test_historical_season_lineage.py tests/test_historical_trade_transition.py tests/test_historical_trade_state.py tests/test_state_postgres_history.py
