name: Build private-beta I1 activation artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_private_beta_i1_activation.py'
      - 'scripts/extract_private_beta_completed_source_points.R'
      - '.github/workflows/private-beta-i1-activation.yml'
      - 'src/fsffl/forecast/i1_artifact.py'
      - 'src/fsffl/forecast/i1_current_facts.py'
      - 'src/fsffl/forecast/integrated_i1.py'
  workflow_dispatch:

concurrency:
  group: private-beta-i1-activation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NFLREADPY_CACHE: filesystem
  NFLREADPY_CACHE_DURATION: '86400'
  NFLREADPY_TIMEOUT: '180'
  NFLREADPY_VERBOSE: 'False'

jobs:
  build-activation-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout implementation
        uses: actions/checkout@v4

      - name: Checkout frozen research oracle
        uses: actions/checkout@v4
        with:
          ref: c12402df1b7fa0bfbb3d994bdcf791d80e103a0c
          path: research_ref

      - name: Remove unrelated broken runner apt source
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/microsoft-prod.sources \
                     /etc/apt/sources.list.d/azure-cli.sources || true

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install activation tooling
        run: python -m pip install -e . pytest pandas nflreadpy pyarrow

      - name: Build frozen PIT football panels
        run: |
          Rscript research_ref/scripts/extract_career_transition_panel.R
          Rscript research_ref/scripts/extract_forecast_usage_panel.R

      - name: Extract frozen-coordinate completed-source points
        run: |
          Rscript scripts/extract_private_beta_completed_source_points.R \
            artifacts/next2-career/cache/player_stats_seasonal.RData \
            /tmp/private_beta_completed_source_points.csv

      - name: Prefetch completed-source beta data with retries
        run: |
          python - <<'PY'
          import time
          from pathlib import Path
          import nflreadpy as nfl
          from nflreadpy.config import update_config

          update_config(
              cache_mode='filesystem',
              cache_dir=Path('/tmp/nflreadpy-cache'),
              cache_duration=86400,
              timeout=180,
              verbose=False,
          )

          def retry(label, fn, attempts=4):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      print(f'prefetch {label}: attempt {attempt}/{attempts}', flush=True)
                      value = fn()
                      print(f'prefetch {label}: ok', flush=True)
                      return value
                  except Exception as exc:
                      last = exc
                      print(f'prefetch {label}: {type(exc).__name__}: {exc}', flush=True)
                      if attempt < attempts:
                          time.sleep(5 * attempt)
              raise RuntimeError(f'prefetch failed for {label}') from last

          for season in (2020, 2021, 2022, 2024, 2025):
              retry(
                  f'player_stats_reg_{season}',
                  lambda season=season: nfl.load_player_stats([season], summary_level='reg'),
              )
          retry(
              'player_stats_week_2025',
              lambda: nfl.load_player_stats([2025], summary_level='week'),
          )
          retry('players', nfl.load_players)
          retry('rosters_2025', lambda: nfl.load_rosters([2025]))
          PY

      - name: Build 2026 private-beta activation artifacts
        run: |
          python scripts/build_private_beta_i1_activation.py \
            --research-root research_ref \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --usage-panel artifacts/forecast-disappearance/final/forecast_usage_panel.csv \
            --source-points-csv /tmp/private_beta_completed_source_points.csv \
            --output-dir artifacts/implementation/private-beta-activation \
            --evaluation-season 2026

      - name: Verify artifact load and schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fsffl.forecast.i1_artifact import FrozenI1Artifact
          from fsffl.forecast.i1_current_facts import CurrentI1FactsArtifact

          root = Path('artifacts/implementation/private-beta-activation')
          FrozenI1Artifact.load(root / 'frozen_i1_h12.json')
          FrozenI1Artifact.load(root / 'frozen_i1_h3.json')
          facts = CurrentI1FactsArtifact.load(root / 'current_i1_facts_2026.json')
          report = json.loads((root / 'private_beta_activation_build_report.json').read_text())
          assert report['status'] == 'PASS'
          assert report['model_changes'] is False
          assert facts.evaluation_season == 2026
          assert facts.completed_source_season == 2025
          assert facts.source_season_complete is True
          assert len(facts.rows) == report['current_fact_rows']
          coordinate = report['current_fact_metadata']['research_coordinate_validation']
          assert coordinate['status'] == 'PASS'
          assert coordinate['max_abs_fantasy_points_diff'] <= 1e-12
          print(json.dumps({
              'status': 'PASS',
              'current_fact_rows': len(facts.rows),
              'providers': report['current_fact_metadata']['providers'],
              'coordinate_validation': coordinate,
              'secondary_source_drift_audit': report['current_fact_metadata']['secondary_source_drift_audit'],
              'zero_fact_basis_counts': report['current_fact_metadata']['zero_fact_basis_counts'],
          }, indent=2, sort_keys=True))
          PY

      - name: Generate runtime activation bundle module
        if: github.event_name == 'pull_request'
        env:
          ACTIVATION_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import zlib
          from pathlib import Path

          root = Path('artifacts/implementation/private-beta-activation')
          names = (
              'frozen_i1_h12.json',
              'frozen_i1_h3.json',
              'current_i1_facts_2026.json',
              'private_beta_activation_build_report.json',
          )
          payloads = {name: (root / name).read_bytes() for name in names}
          hashes = {name: hashlib.sha256(payload).hexdigest() for name, payload in payloads.items()}
          manifest = json.dumps(hashes, sort_keys=True, separators=(',', ':')).encode('utf-8')
          bundle_hash = hashlib.sha256(manifest).hexdigest()
          encoded = {
              name: base64.b64encode(zlib.compress(payload, level=9)).decode('ascii')
              for name, payload in payloads.items()
          }
          target = Path('src/fsffl/value/private_beta_activation_data.py')
          target.write_text(
              'from __future__ import annotations\n\n'
              'import base64\nimport hashlib\nimport zlib\n\n'
              '# Generated only after the governed private-beta activation build passes.\n'
              '# Runtime consumers see provider-neutral JSON through the frozen schemas.\n\n'
              f'ACTIVATION_WORKFLOW_RUN_ID = {int(os.environ["ACTIVATION_WORKFLOW_RUN_ID"])}\n'
              f'ACTIVATION_BUNDLE_SHA256 = {bundle_hash!r}\n'
              f'ACTIVATION_ARTIFACT_SHA256 = {hashes!r}\n'
              f'_COMPRESSED_ARTIFACTS = {encoded!r}\n\n'
              'def activation_artifact_text(name: str) -> str:\n'
              '    try:\n'
              '        encoded = _COMPRESSED_ARTIFACTS[name]\n'
              '        expected = ACTIVATION_ARTIFACT_SHA256[name]\n'
              '    except KeyError as exc:\n'
              '        raise ValueError(f"missing private-beta activation artifact: {name}") from exc\n'
              '    raw = zlib.decompress(base64.b64decode(encoded, validate=True))\n'
              '    actual = hashlib.sha256(raw).hexdigest()\n'
              '    if actual != expected:\n'
              '        raise ValueError(f"private-beta activation artifact digest mismatch: {name}")\n'
              '    return raw.decode("utf-8")\n',
              encoding='utf-8',
          )
          print('runtime activation bundle:', bundle_hash)
          print('artifact hashes:', json.dumps(hashes, indent=2, sort_keys=True))
          PY

      - name: Upload private-beta activation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-beta-i1-activation
          path: artifacts/implementation/private-beta-activation/*
          if-no-files-found: warn
          retention-days: 14

      - name: Commit frozen runtime activation bundle
        if: github.event_name == 'pull_request' && success()
        run: |
          if git diff --quiet -- src/fsffl/value/private_beta_activation_data.py; then
            echo 'runtime activation bundle unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fsffl/value/private_beta_activation_data.py
          git commit -m 'chore: freeze private-beta activation bundle'
          git push origin HEAD:${{ github.head_ref }}
