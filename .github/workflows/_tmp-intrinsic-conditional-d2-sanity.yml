name: Temporary Intrinsic Conditional D2 Sanity

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_intrinsic_explicit_state_sanity_conditional.py'
      - '.github/workflows/_tmp-intrinsic-conditional-d2-sanity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Build PIT career panel
        run: Rscript scripts/extract_career_transition_panel.R
      - name: Download immutable Forecast evidence
        run: |
          mkdir -p artifacts/forecast-state/frozen-pr131 artifacts/forecast-state/frozen-qb
          gh api repos/${{ github.repository }}/actions/artifacts/10318004415/zip > /tmp/pr131.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10317272576/zip > /tmp/qb.zip
          unzip -q /tmp/pr131.zip -d artifacts/forecast-state/frozen-pr131
          unzip -q /tmp/qb.zip -d artifacts/forecast-state/frozen-qb
      - name: Conditional current sanity
        env:
          FSFFL_CONDITIONAL_D2_VARIANT: conditional
        run: |
          mkdir -p artifacts/conditional-d2-sanity/conditional
          python scripts/run_intrinsic_explicit_state_sanity_conditional.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/forecast-state/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/forecast-state/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/conditional-d2-sanity/conditional
      - name: Shrunk conditional current sanity
        env:
          FSFFL_CONDITIONAL_D2_VARIANT: shrunk
        run: |
          mkdir -p artifacts/conditional-d2-sanity/shrunk
          python scripts/run_intrinsic_explicit_state_sanity_conditional.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/forecast-state/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/forecast-state/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/conditional-d2-sanity/shrunk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intrinsic-conditional-d2-sanity
          path: artifacts/conditional-d2-sanity/**/*.json
          retention-days: 30
