name: Fundamental Intrinsic Calibration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/extract_career_transition_panel.R'
      - 'scripts/run_career_calibration.py'
      - 'scripts/run_fundamental_intrinsic_residual_calibration.py'
      - 'scripts/run_fundamental_intrinsic_v5c_calibration.py'
      - 'src/fsffl/value/intrinsic_v2.py'
      - '.github/workflows/fundamental-intrinsic-calibration.yml'

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build PIT football career panel
        run: Rscript scripts/extract_career_transition_panel.R
      - name: Reproduce Fundamental Intrinsic v4 baseline
        run: |
          python scripts/run_fundamental_intrinsic_residual_calibration.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --output-dir artifacts/fundamental-intrinsic
      - name: Calibrate selected bounded shared-scale repair
        run: |
          python scripts/run_fundamental_intrinsic_v5c_calibration.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --output-dir artifacts/fundamental-intrinsic
      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamental-intrinsic-calibration
          path: |
            artifacts/fundamental-intrinsic/fundamental_intrinsic_residual_calibration.json
            artifacts/fundamental-intrinsic/fundamental_intrinsic_residual_calibration.md
            artifacts/fundamental-intrinsic/fundamental_intrinsic_v5c_calibration.json
            artifacts/next2-career/career_transition_coverage.csv
          retention-days: 14