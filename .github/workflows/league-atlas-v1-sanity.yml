name: League Atlas v1 real-league sanity

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/fsffl/product/static/league_atlas_v1.js"
      - "src/fsffl/product/static/product_shell.js"
      - "scripts/run_league_atlas_v1_sanity.py"
      - ".github/workflows/league-atlas-v1-sanity.yml"
      - "src/fsffl/product/league_value_lenses.py"
      - "src/fsffl/product/league_value_lens_routes.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[web]'
      - name: Check Atlas JavaScript syntax
        run: node --check src/fsffl/product/static/league_atlas_v1.js
      - name: Run real-league Atlas sanity
        run: python scripts/run_league_atlas_v1_sanity.py
      - name: Upload Atlas sanity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-atlas-v1-sanity
          path: artifacts/diagnostics/league_atlas_v1_20260921/
          if-no-files-found: error
