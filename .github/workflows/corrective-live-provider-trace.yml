name: Corrective live provider numerical trace

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/corrective-live-provider-trace.yml"
      - "scripts/run_live_razzball_numerical_trace.py"
      - "src/fsffl/forecast/**"
      - "src/fsffl/providers/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[web]'
      - name: Run live numerical trace
        run: python scripts/run_live_razzball_numerical_trace.py
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrective-live-provider-numerical-trace
          path: artifacts/diagnostics/live_razzball_numerical_trace_20260920/
          if-no-files-found: error
          retention-days: 14
