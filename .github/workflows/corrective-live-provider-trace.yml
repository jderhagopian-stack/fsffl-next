name: Corrective live provider numerical trace

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/corrective-live-provider-trace.yml"
      - "scripts/run_live_razzball_numerical_trace.py"
      - "src/fsffl/forecast/**"
      - "src/fsffl/providers/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[web]'
      - name: Run live numerical trace
        shell: bash
        run: |
          mkdir -p artifacts/diagnostics/live_razzball_numerical_trace_20260920
          set +e
          python scripts/run_live_razzball_numerical_trace.py 2>&1 | tee artifacts/diagnostics/live_razzball_numerical_trace_20260920/WORKFLOW_TRACE.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -q "revision-agnostic numerical-integrity gate" artifacts/diagnostics/live_razzball_numerical_trace_20260920/WORKFLOW_TRACE.log; then
            cat > artifacts/diagnostics/live_razzball_numerical_trace_20260920/EXPECTED_QUARANTINE.md <<'EOF'
          # Expected live-provider quarantine

          The current live provider revision was rejected by the revision-agnostic
          numerical-integrity gate before it could enter the authoritative ensemble.
          With fewer than two healthy independent sources, fail-closed behavior is
          the expected diagnostic outcome.
          EOF
            exit 0
          fi
          if grep -q "provider produced no complete season fantasy-point observations for source-health evaluation" artifacts/diagnostics/live_razzball_numerical_trace_20260920/WORKFLOW_TRACE.log; then
            cat > artifacts/diagnostics/live_razzball_numerical_trace_20260920/EXPECTED_ACTIVE_RULE_QUARANTINE.md <<'EOF'
          # Expected active-rule evidence quarantine

          The diagnostic league scores fumble loss. The currently acquired provider
          set did not supply complete raw evidence for every active scoring coordinate,
          so Forecast correctly withheld provider fantasy-point observations and the
          authoritative ensemble failed closed. This is an expected evidence gate,
          not permission to synthesize zero or weaken scoring completeness.
          EOF
            exit 0
          fi
          exit "$status"
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrective-live-provider-numerical-trace
          path: artifacts/diagnostics/live_razzball_numerical_trace_20260920/
          if-no-files-found: error
          retention-days: 14
