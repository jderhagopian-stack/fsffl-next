name: Research Future-State Resolution Phase 2 Final

on:
  push:
    branches: [research/future-state-resolution-phase2]
    paths:
      - 'scripts/extract_phase2_future_state_panel.R'
      - 'scripts/run_phase2_future_state_empirical.py'
      - 'scripts/run_phase2_q3_age_state_correction.py'
      - 'artifacts/research/future_state_phase2_empirical_protocol.md'
      - 'artifacts/research/future_state_phase2_q3_method_addendum.md'
      - '.github/workflows/future-state-resolution-phase2-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-final:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and diagnostic dependencies
        run: |
          python -m pip install -e .
          python -m pip install pandas scipy statsmodels
      - name: Build point-in-time historical player-season panel
        run: Rscript scripts/extract_phase2_future_state_panel.R
      - name: Run frozen Phase 2 Q1/Q2 and base outcome diagnostics
        run: |
          python scripts/run_phase2_future_state_empirical.py \
            --panel artifacts/research/future-state-phase2/phase2_player_season_panel.csv \
            --output artifacts/research/future-state-phase2/phase2_future_state_empirical_results.json \
            --rows-output artifacts/research/future-state-phase2/phase2_future_state_empirical_rows.csv
      - name: Run Q3 age-state definition correction
        run: |
          python scripts/run_phase2_q3_age_state_correction.py \
            --panel artifacts/research/future-state-phase2/phase2_player_season_panel.csv \
            --base-rows artifacts/research/future-state-phase2/phase2_future_state_empirical_rows.csv \
            --output artifacts/research/future-state-phase2/phase2_q3_age_state_results.json \
            --rows-output artifacts/research/future-state-phase2/phase2_q3_age_state_rows.csv
      - name: Upload final Phase 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-state-resolution-phase2-final
          path: |
            artifacts/research/future-state-phase2/phase2_future_state_empirical_results.json
            artifacts/research/future-state-phase2/phase2_future_state_empirical_rows.csv
            artifacts/research/future-state-phase2/phase2_q3_age_state_results.json
            artifacts/research/future-state-phase2/phase2_q3_age_state_rows.csv
            artifacts/research/future-state-phase2/phase2_player_season_panel.csv
            artifacts/research/future_state_phase2_empirical_protocol.md
            artifacts/research/future_state_phase2_q3_method_addendum.md
          retention-days: 14
