name: Intrinsic Term Structure Research
on:
  push:
    branches: [research/intrinsic-term-structure-20260926]
    paths:
      - scripts/extract_long_horizon_player_seasons.R
      - scripts/run_intrinsic_term_structure_research.py
      - .github/workflows/intrinsic-term-structure-research.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: \${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install -e . pandas numpy scikit-learn
      - name: Build governed historical player-season panel
        run: Rscript scripts/extract_long_horizon_player_seasons.R
      - name: Download frozen governed baseline artifacts
        run: |
          mkdir -p artifacts/research/intrinsic_term_structure_20260926/frozen/modela \
                   artifacts/research/intrinsic_term_structure_20260926/frozen/qb \
                   artifacts/research/intrinsic_term_structure_20260926/frozen/shapley
          gh api repos/\${{ github.repository }}/actions/artifacts/10318004415/zip > /tmp/modela.zip
          gh api repos/\${{ github.repository }}/actions/artifacts/10317272576/zip > /tmp/qb.zip
          gh api repos/\${{ github.repository }}/actions/artifacts/10423228014/zip > /tmp/shapley.zip
          unzip -q /tmp/modela.zip -d artifacts/research/intrinsic_term_structure_20260926/frozen/modela
          unzip -q /tmp/qb.zip -d artifacts/research/intrinsic_term_structure_20260926/frozen/qb
          unzip -q /tmp/shapley.zip -d artifacts/research/intrinsic_term_structure_20260926/frozen/shapley
      - name: Run bounded term-structure study
        run: |
          python scripts/run_intrinsic_term_structure_research.py \
            --model-a-rows artifacts/research/intrinsic_term_structure_20260926/frozen/modela/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/research/intrinsic_term_structure_20260926/frozen/qb/qb_career_state_deployment_results.json \
            --player-seasons artifacts/research/intrinsic_term_structure_20260926/PLAYER_SEASONS.csv \
            --shapley-rows artifacts/research/intrinsic_term_structure_20260926/frozen/shapley/integrated-downstream/results/integrated_forecast_shapley_rows.json
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intrinsic-term-structure-research
          path: artifacts/research/intrinsic_term_structure_20260926/*
          retention-days: 14
