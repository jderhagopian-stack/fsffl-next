name: Historical 2023 season-wide source ledger (research only)

on:
  pull_request:
    paths:
      - 'src/fsffl/state/retrospective_season_audit.py'
      - 'src/fsffl/state/historical_roster_context.py'
      - 'src/fsffl/behavioral/historical_circumstances.py'
      - 'src/fsffl/behavioral/historical_cases.py'
      - 'src/fsffl/behavioral/historical_trade_context.py'
      - 'src/fsffl/trade_decision/contextual_precedents.py'
      - 'src/fsffl/trade_decision/owner_history.py'
      - 'src/fsffl/product/owner_history_runtime.py'
      - 'tests/test_contextual_trade_precedents.py'
      - 'tests/test_owner_current_season.py'
      - 'src/fsffl/behavioral/current_season.py'
      - 'src/fsffl/product/owner_current_season.py'
      - 'tests/test_contextual_precedents_pinned.py'
      - 'src/fsffl/behavioral/historical_case_models.py'
      - 'src/fsffl/behavioral/owner_resume.py'
      - 'src/fsffl/behavioral/dossier_publication.py'
      - 'src/fsffl/behavioral/store.py'
      - 'src/fsffl/behavioral/postgres_store.py'
      - 'src/fsffl/product/behavioral_runtime.py'
      - 'src/fsffl/product/persistent_webapp.py'
      - 'tests/test_owner_dossier_publication.py'
      - 'scripts/publish_owner_dossier.py'
      - 'tests/test_owner_franchise_resume.py'
      - 'src/fsffl/behavioral/sleeper_history.py'
      - 'src/fsffl/behavioral/service.py'
      - 'src/fsffl/behavioral/models.py'
      - 'src/fsffl/product/historical_owner_delivery.py'
      - 'tests/test_contextual_owner_delivery.py'
      - 'tests/test_contextual_owner_delivery_pinned.py'
      - 'src/fsffl/providers/sleeper_historical_circumstances.py'
      - 'tests/test_historical_circumstances.py'
      - 'tests/test_historical_circumstances_pinned.py'
      - 'tests/historical_circumstances_fixture.py'
      - 'src/fsffl/state/historical_draft_allocation.py'
      - 'src/fsffl/providers/sleeper_historical_draft_players.py'
      - 'src/fsffl/state/historical_roster_state.py'
      - 'tests/test_historical_draft_players.py'
      - 'tests/test_historical_roster_state.py'
      - 'src/fsffl/state/historical_roster_replay.py'
      - 'src/fsffl/state/historical_pick_inventory.py'
      - 'src/fsffl/state/historical_pick_lineage.py'
      - 'src/fsffl/state/historical_trade_context_coverage.py'
      - 'src/fsffl/providers/sleeper_historical_context.py'
      - 'tests/test_historical_cross_season_context.py'
      - 'tests/historical_archive_context_fixture.py'
      - 'src/fsffl/providers/sleeper_historical_pick_inventory.py'
      - 'tests/test_historical_pick_inventory.py'
      - 'scripts/audit_historical_pick_inventory.py'
      - 'tests/test_retrospective_season_audit.py'
      - 'tests/test_retrospective_full_2023_archive.py'
      - 'tests/test_historical_roster_context.py'
      - 'tests/test_historical_roster_replay.py'
      - 'scripts/audit_retrospective_sleeper_season.py'
      - '.github/workflows/historical-season-2023-audit.yml'
      - 'docs/operations/workstreams/HISTORICAL_2023_SEASON_LEDGER_20261101.md'

permissions:
  contents: read

jobs:
  season-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dossier-test-only
          POSTGRES_DB: fsffl_dossier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fsffl_dossier_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout exact current PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Use governed Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install local code and tests
        run: python -m pip install -e '.[dev,web]'
      - name: Focused season and inherited historical contracts
        run: |
          python -m pytest -q tests/test_contextual_owner_delivery.py tests/test_contextual_trade_precedents.py tests/test_owner_current_season.py \
            tests/test_historical_circumstances.py \
            tests/test_historical_draft_players.py \
            tests/test_historical_roster_state.py \
            tests/test_retrospective_season_audit.py \
            tests/test_historical_pick_inventory.py \
            tests/test_historical_cross_season_context.py \
            tests/test_historical_roster_context.py \
            tests/test_retrospective_sleeper_replay.py \
            tests/test_historical_coverage.py \
            tests/test_historical_season_lineage.py \
            tests/test_historical_trade_transition.py \
            tests/test_historical_trade_state.py \
            tests/test_state_postgres_history.py
      - name: Real isolated PostgreSQL dossier publication and refresh
        env:
          FSFFL_DOSSIER_TEST_DATABASE_URL: postgresql://postgres:dossier-test-only@127.0.0.1:5432/fsffl_dossier_test
        run: python -m pytest -q tests/test_owner_dossier_publication.py
      - name: Fetch disposable exact public legacy archive (not committed)
        env:
          SOURCE_URL: https://raw.githubusercontent.com/jderhagopian-stack/sleeper-league-data/1179d3104cbe3330cf27e4173d61df95f2494b1a/data/league_history.json
        run: |
          curl --fail --silent --show-error --location --retry 2 --output "$RUNNER_TEMP/historical-archive.json" "$SOURCE_URL"
          test "$(git hash-object "$RUNNER_TEMP/historical-archive.json")" = "e18c01bf25f58c5dfe3d0802f53de484ea257ca1"
      - name: Fetch disposable pinned circumstance sources
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from hashlib import sha1, sha256
          import os, shutil, urllib.request
          from tests.test_historical_circumstances_pinned import BLOBS
          from tests.historical_circumstances_fixture import CALENDAR_COMMIT, CALENDAR_SHA256
          root = Path(os.environ['RUNNER_TEMP']) / 'historical-circumstances'
          root.mkdir(exist_ok=True)
          shutil.copyfile(Path(os.environ['RUNNER_TEMP'])/'historical-archive.json', root/'league_history.json')
          for name, blob in BLOBS.items():
              if name == 'league_history.json':
                  continue
              year = name.split('-')[1].split('.')[0]
              source_name = 'player_season_fsffl.json' if name.startswith('actuals-') else 'league_matchups_raw.json'
              url = f'https://raw.githubusercontent.com/jderhagopian-stack/sleeper-league-data/1179d3104cbe3330cf27e4173d61df95f2494b1a/data/stats/fsffl/{year}/{source_name}'
              with urllib.request.urlopen(url, timeout=30) as response:
                  raw = response.read()
              assert sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == blob, name+' hash mismatch'
              (root/name).write_bytes(raw)
          with urllib.request.urlopen(f'https://raw.githubusercontent.com/nflverse/nfldata/{CALENDAR_COMMIT}/data/games.csv', timeout=30) as response:
              raw = response.read()
          assert sha256(raw).hexdigest() == CALENDAR_SHA256, 'calendar hash mismatch'
          (root/'nfl-games.csv').write_bytes(raw)
          PYCODE
      - name: Prove bounded historical circumstance joins (not model promotion)
        env:
          FSFFL_RESEARCH_CIRCUMSTANCE_SOURCE: ${{ runner.temp }}/historical-circumstances
        run: python -m pytest -q -s tests/test_historical_circumstances_pinned.py tests/test_contextual_owner_delivery_pinned.py tests/test_owner_franchise_resume.py tests/test_contextual_precedents_pinned.py
      - name: Prove yearwide source discrepancy is surfaced (not guessed away)
        env:
          FSFFL_RESEARCH_HISTORICAL_ARCHIVE: ${{ runner.temp }}/historical-archive.json
        run: |
          python -m pytest -q -s tests/test_retrospective_full_2023_archive.py
          python scripts/audit_historical_pick_inventory.py \
            --archive "$FSFFL_RESEARCH_HISTORICAL_ARCHIVE" \
            --git-blob-sha e18c01bf25f58c5dfe3d0802f53de484ea257ca1
          set +e
          python scripts/audit_retrospective_sleeper_season.py \
            --archive "$FSFFL_RESEARCH_HISTORICAL_ARCHIVE" \
            --git-blob-sha e18c01bf25f58c5dfe3d0802f53de484ea257ca1 --season 2023
          status=$?
          set -e
          test "$status" -eq 2 # real original history has a known missing movement
      - name: Delete temporary archive even on failure
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/historical-archive.json"
          rm -rf "$RUNNER_TEMP/historical-circumstances"
