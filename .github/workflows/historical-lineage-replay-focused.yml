name: Historical season lineage and factual replay (research only)

on:
  pull_request:
    paths:
      - 'src/fsffl/state/historical_season_lineage.py'
      - 'src/fsffl/state/historical_trade_transition.py'
      - 'src/fsffl/state/historical_coverage.py'
      - 'tests/test_historical_season_lineage.py'
      - 'tests/test_historical_trade_transition.py'
      - 'docs/operations/workstreams/HISTORICAL_SEASON_LINEAGE_REPLAY_20261101.md'
      - '.github/workflows/historical-lineage-replay-focused.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout current exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Use project Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install core and testing dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify exact historical contracts and existing trade persistence regressions
        run: python -m pytest -q tests/test_historical_season_lineage.py tests/test_historical_trade_transition.py tests/test_historical_coverage.py tests/test_historical_trade_state.py tests/test_state_postgres_history.py
