name: PR131 Model A Intrinsic Research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_multiyear_intrinsic_model_a_benchmark.py'
      - 'scripts/run_multiyear_intrinsic_model_a_benchmark_entry.py'
      - 'scripts/run_multiyear_intrinsic_model_a_repair.py'
      - 'scripts/run_multiyear_intrinsic_model_a_repair_entry.py'
      - 'scripts/extract_career_transition_panel.R'
      - '.github/workflows/multiyear-intrinsic-model-a-research.yml'
      - 'src/fsffl/research/**'
      - 'docs/research/MULTIYEAR_INTRINSIC_*.md'
  push:
    branches: [research/multiyear-intrinsic-value-study]
    paths:
      - 'scripts/run_multiyear_intrinsic_model_a_benchmark.py'
      - 'scripts/run_multiyear_intrinsic_model_a_benchmark_entry.py'
      - 'scripts/run_multiyear_intrinsic_model_a_repair.py'
      - 'scripts/run_multiyear_intrinsic_model_a_repair_entry.py'
      - 'scripts/extract_career_transition_panel.R'
      - '.github/workflows/multiyear-intrinsic-model-a-research.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract historical career transition panel
        run: Rscript scripts/extract_career_transition_panel.R
      - name: Clone point-in-time market-history source
        run: git clone --filter=blob:none https://github.com/dynastyprocess/data.git artifacts/dynastyprocess-data
      - name: Run research-only Model A repair benchmark
        run: |
          python scripts/run_multiyear_intrinsic_model_a_repair_entry.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --dynastyprocess-repo artifacts/dynastyprocess-data \
            --output-dir artifacts/multiyear-intrinsic-model-a
      - name: Verify repository tests
        run: |
          python -m pip install -e '.[dev,web]'
          python -m pytest -q
      - name: Upload research audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr131-model-a-intrinsic-repair
          path: |
            artifacts/multiyear-intrinsic-model-a/model_a_repair_results.json
            artifacts/multiyear-intrinsic-model-a/model_a_repair_report.md
            artifacts/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv
            artifacts/multiyear-intrinsic-model-a/model_a_uncertainty_diagnostics.csv
            artifacts/multiyear-intrinsic-model-a/model_a_appreciation_decomposition.csv
            artifacts/next2-career/career_transition_coverage.csv
          retention-days: 14
