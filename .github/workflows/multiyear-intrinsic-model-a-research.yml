name: PR131 Model A Intrinsic Research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_multiyear_intrinsic_model_a_benchmark.py'
      - 'scripts/run_multiyear_intrinsic_model_a_benchmark_entry.py'
      - 'scripts/run_multiyear_intrinsic_model_a_repair.py'
      - 'scripts/run_multiyear_intrinsic_model_a_repair_entry.py'
      - 'scripts/run_forecast_update_reliability_audit.py'
      - 'scripts/run_forecast_update_reliability_audit_entry.py'
      - 'scripts/run_forecast_update_gain_calibration_audit.py'
      - 'scripts/run_forecast_trajectory_shape_audit.py'
      - 'scripts/run_forecast_trajectory_challengers.py'
      - 'scripts/run_forecast_trajectory_challengers_entry.py'
      - 'scripts/run_hierarchical_trajectory_state_research.py'
      - 'scripts/run_player_specific_trajectory_residual_research.py'
      - 'scripts/run_within_player_trajectory_innovation_research.py'
      - 'scripts/extract_career_transition_panel.R'
      - '.github/workflows/multiyear-intrinsic-model-a-research.yml'
      - 'src/fsffl/research/**'
      - 'docs/research/MULTIYEAR_INTRINSIC_*.md'
  push:
    branches: [research/multiyear-intrinsic-value-study]
    paths:
      - 'scripts/run_multiyear_intrinsic_model_a_benchmark.py'
      - 'scripts/run_multiyear_intrinsic_model_a_benchmark_entry.py'
      - 'scripts/run_multiyear_intrinsic_model_a_repair.py'
      - 'scripts/run_multiyear_intrinsic_model_a_repair_entry.py'
      - 'scripts/run_forecast_update_reliability_audit.py'
      - 'scripts/run_forecast_update_reliability_audit_entry.py'
      - 'scripts/run_forecast_update_gain_calibration_audit.py'
      - 'scripts/run_forecast_trajectory_shape_audit.py'
      - 'scripts/run_forecast_trajectory_challengers.py'
      - 'scripts/run_forecast_trajectory_challengers_entry.py'
      - 'scripts/run_hierarchical_trajectory_state_research.py'
      - 'scripts/run_player_specific_trajectory_residual_research.py'
      - 'scripts/run_within_player_trajectory_innovation_research.py'
      - 'scripts/extract_career_transition_panel.R'
      - '.github/workflows/multiyear-intrinsic-model-a-research.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract historical career transition panel
        run: Rscript scripts/extract_career_transition_panel.R
      - name: Clone point-in-time market-history source
        run: git clone --filter=blob:none https://github.com/dynastyprocess/data.git artifacts/dynastyprocess-data
      - name: Run research-only Model A repair benchmark
        run: |
          python scripts/run_multiyear_intrinsic_model_a_repair_entry.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --dynastyprocess-repo artifacts/dynastyprocess-data \
            --output-dir artifacts/multiyear-intrinsic-model-a
      - name: Run Forecast update reliability and gain-calibration audit
        run: |
          python scripts/run_forecast_update_gain_calibration_audit.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --dynastyprocess-repo artifacts/dynastyprocess-data \
            --output-dir artifacts/multiyear-intrinsic-model-a
      - name: Run Forecast trajectory-shape audit
        run: |
          python scripts/run_forecast_trajectory_shape_audit.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --output-dir artifacts/multiyear-intrinsic-model-a
      - name: Validate narrow Forecast trajectory challengers
        run: |
          python scripts/run_forecast_trajectory_challengers_entry.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --dynastyprocess-repo artifacts/dynastyprocess-data \
            --output-dir artifacts/multiyear-intrinsic-model-a
      - name: Research hierarchical trajectory-state Forecast challenger
        run: |
          python scripts/run_hierarchical_trajectory_state_research.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --dynastyprocess-repo artifacts/dynastyprocess-data \
            --output-dir artifacts/multiyear-intrinsic-model-a
      - name: Research player-specific multi-season trajectory residual
        run: |
          python scripts/run_player_specific_trajectory_residual_research.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --dynastyprocess-repo artifacts/dynastyprocess-data \
            --output-dir artifacts/multiyear-intrinsic-model-a
      - name: Research within-player trajectory innovation dynamics
        run: |
          python scripts/run_within_player_trajectory_innovation_research.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --dynastyprocess-repo artifacts/dynastyprocess-data \
            --output-dir artifacts/multiyear-intrinsic-model-a
      - name: Verify repository tests
        run: |
          python -m pip install -e '.[dev,web]'
          python -m pytest -q
      - name: Upload research audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr131-model-a-intrinsic-forecast-audit
          path: |
            artifacts/multiyear-intrinsic-model-a/model_a_repair_results.json
            artifacts/multiyear-intrinsic-model-a/model_a_repair_report.md
            artifacts/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv
            artifacts/multiyear-intrinsic-model-a/model_a_uncertainty_diagnostics.csv
            artifacts/multiyear-intrinsic-model-a/model_a_appreciation_decomposition.csv
            artifacts/multiyear-intrinsic-model-a/forecast_update_reliability_results.json
            artifacts/multiyear-intrinsic-model-a/forecast_update_reliability_report.md
            artifacts/multiyear-intrinsic-model-a/forecast_update_reliability_rows.csv
            artifacts/multiyear-intrinsic-model-a/forecast_update_group_diagnostics.csv
            artifacts/multiyear-intrinsic-model-a/forecast_update_repaired_model_a_rows.csv
            artifacts/multiyear-intrinsic-model-a/forecast_trajectory_shape_results.json
            artifacts/multiyear-intrinsic-model-a/forecast_trajectory_shape_report.md
            artifacts/multiyear-intrinsic-model-a/forecast_trajectory_shape_rows.csv
            artifacts/multiyear-intrinsic-model-a/forecast_trajectory_shape_group_diagnostics.csv
            artifacts/multiyear-intrinsic-model-a/forecast_trajectory_challengers_results.json
            artifacts/multiyear-intrinsic-model-a/forecast_trajectory_challengers_report.md
            artifacts/multiyear-intrinsic-model-a/hierarchical_trajectory_state_results.json
            artifacts/multiyear-intrinsic-model-a/hierarchical_trajectory_state_report.md
            artifacts/multiyear-intrinsic-model-a/hierarchical_trajectory_state_weights.csv
            artifacts/multiyear-intrinsic-model-a/player_specific_trajectory_residual_results.json
            artifacts/multiyear-intrinsic-model-a/player_specific_trajectory_residual_report.md
            artifacts/multiyear-intrinsic-model-a/player_specific_trajectory_residual_states.csv
            artifacts/multiyear-intrinsic-model-a/player_specific_trajectory_residual_adjustments.csv
            artifacts/multiyear-intrinsic-model-a/within_player_trajectory_innovation_results.json
            artifacts/multiyear-intrinsic-model-a/within_player_trajectory_innovation_report.md
            artifacts/multiyear-intrinsic-model-a/within_player_trajectory_innovation_states.csv
            artifacts/multiyear-intrinsic-model-a/within_player_trajectory_innovation_adjustments.csv
            artifacts/multiyear-intrinsic-model-a/within_player_trajectory_level_plus_innovation_adjustments.csv
            artifacts/next2-career/career_transition_coverage.csv
          retention-days: 14
