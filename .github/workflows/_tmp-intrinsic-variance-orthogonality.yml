name: Temporary Intrinsic Variance Orthogonality

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_intrinsic_explicit_state_conditional_quality.py'
      - 'scripts/run_intrinsic_explicit_state_sanity_conditional.py'
      - 'scripts/run_intrinsic_variance_orthogonality_synthetic.py'
      - '.github/workflows/_tmp-intrinsic-variance-orthogonality.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bounded-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Build PIT career panel
        run: Rscript scripts/extract_career_transition_panel.R
      - name: Download immutable Forecast evidence
        run: |
          mkdir -p artifacts/forecast-state/frozen-pr131 artifacts/forecast-state/frozen-qb
          gh api repos/${{ github.repository }}/actions/artifacts/10318004415/zip > /tmp/pr131.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10317272576/zip > /tmp/qb.zip
          unzip -q /tmp/pr131.zip -d artifacts/forecast-state/frozen-pr131
          unzip -q /tmp/qb.zip -d artifacts/forecast-state/frozen-qb
      - name: Frozen D2 benchmark
        run: |
          mkdir -p artifacts/variance-orthogonality/frozen
          python scripts/run_intrinsic_explicit_state_challenge_d2.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/forecast-state/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/forecast-state/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/variance-orthogonality/frozen
      - name: Direct conditional D2 benchmark
        env:
          FSFFL_CONDITIONAL_D2_VARIANT: conditional
        run: |
          mkdir -p artifacts/variance-orthogonality/direct
          python scripts/run_intrinsic_explicit_state_conditional_quality.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/forecast-state/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/forecast-state/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/variance-orthogonality/direct
      - name: Variance-orthogonal central D2
        env:
          FSFFL_CONDITIONAL_D2_VARIANT: central
        run: |
          mkdir -p artifacts/variance-orthogonality/central
          python scripts/run_intrinsic_explicit_state_conditional_quality.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/forecast-state/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/forecast-state/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/variance-orthogonality/central
      - name: Central current-player sanity
        env:
          FSFFL_CONDITIONAL_D2_VARIANT: central
        run: |
          mkdir -p artifacts/variance-orthogonality/sanity
          python scripts/run_intrinsic_explicit_state_sanity_conditional.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/forecast-state/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/forecast-state/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/variance-orthogonality/sanity
      - name: Synthetic orthogonality gates
        run: python scripts/run_intrinsic_variance_orthogonality_synthetic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intrinsic-variance-orthogonality
          path: artifacts/variance-orthogonality/**/*.json
          retention-days: 30
