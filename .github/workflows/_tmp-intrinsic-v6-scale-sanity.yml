name: Temporary Intrinsic v6 Scale Sanity
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_tmp_intrinsic_v6_scale_sanity.py'
      - '.github/workflows/_tmp-intrinsic-v6-scale-sanity.yml'
      - 'src/fsffl/value/intrinsic_v2.py'
permissions:
  contents: read
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/_tmp_intrinsic_v6_scale_sanity.py