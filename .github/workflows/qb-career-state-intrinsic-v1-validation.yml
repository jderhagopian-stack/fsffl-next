name: QB Career State Intrinsic v1 Validation

on:
  workflow_dispatch:
  push:
    branches: [production/intrinsic-value-v1]
    paths:
      - 'src/fsffl/forecast/qb_career_state.py'
      - 'src/fsffl/forecast/qb_career_state_runtime.py'
      - 'src/fsffl/forecast/intrinsic_v1.py'
      - 'src/fsffl/value/intrinsic_runtime.py'
      - 'scripts/run_intrinsic_v1_qb_integration_validation.py'
      - '.github/workflows/qb-career-state-intrinsic-v1-validation.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen governed research evidence
        run: |
          mkdir -p artifacts/qb-intrinsic-validation/pr131 artifacts/qb-intrinsic-validation/qb
          gh api repos/${{ github.repository }}/actions/artifacts/10318004415/zip > /tmp/pr131.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10317272576/zip > /tmp/qb.zip
          unzip -q /tmp/pr131.zip -d artifacts/qb-intrinsic-validation/pr131
          unzip -q /tmp/qb.zip -d artifacts/qb-intrinsic-validation/qb
      - name: Recompute integrated Intrinsic v1
        run: |
          python scripts/run_intrinsic_v1_qb_integration_validation.py \
            --model-a-rows artifacts/qb-intrinsic-validation/pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --model-a-results artifacts/qb-intrinsic-validation/pr131/multiyear-intrinsic-model-a/model_a_repair_results.json \
            --qb-results artifacts/qb-intrinsic-validation/qb/qb_career_state_deployment_results.json \
            --output artifacts/qb-intrinsic-validation/qb_career_state_intrinsic_v1_validation.json
      - name: Upload integrated validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-career-state-intrinsic-v1-validation
          path: artifacts/qb-intrinsic-validation/qb_career_state_intrinsic_v1_validation.json
          retention-days: 14
