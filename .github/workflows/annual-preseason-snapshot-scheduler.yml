name: Annual preseason snapshot scheduler

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FSFFL_ANNUAL_SNAPSHOT_ENDPOINT: "https://fsffl-next-private-beta.onrender.com/internal/annual-preseason-snapshot/capture"

jobs:
  invoke-hosted-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FSFFL_SCHEDULER_TOKEN: ${{ secrets.FSFFL_SCHEDULER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Report dormant secure-secret boundary
        if: ${{ env.FSFFL_SCHEDULER_TOKEN == '' }}
        run: |
          echo "Annual preseason scheduler is DORMANT - secure GitHub Actions secret FSFFL_SCHEDULER_TOKEN is not configured."

      - name: Invoke governed hosted annual capture
        if: ${{ env.FSFFL_SCHEDULER_TOKEN != '' }}
        run: python scripts/run_annual_preseason_scheduler_tick.py
