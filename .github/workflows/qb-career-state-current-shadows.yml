name: QB Career State Current Shadows

on:
  workflow_dispatch:
  push:
    branches: [production/intrinsic-value-v1]
    paths:
      - 'src/fsffl/forecast/qb_career_state.py'
      - 'src/fsffl/forecast/qb_career_state_runtime.py'
      - 'src/fsffl/forecast/intrinsic_v1.py'
      - 'src/fsffl/value/intrinsic_runtime.py'
      - 'scripts/run_qb_career_state_current_shadows.py'
      - '.github/workflows/qb-career-state-current-shadows.yml'

permissions:
  contents: read

jobs:
  shadows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[web]'
      - name: Run live QB shadows
        run: python scripts/run_qb_career_state_current_shadows.py
      - name: Upload shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-career-state-current-shadows
          path: artifacts/qb-career-state-current-shadows/qb_career_state_current_shadows.json
          retention-days: 14
