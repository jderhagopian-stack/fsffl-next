name: Live Razzball numerical trace

on:
  push:
    branches:
      - correctness/forecast-value-authority-reconciliation-20260920
    paths:
      - "scripts/run_live_razzball_numerical_trace.py"
      - ".github/workflows/live-razzball-numerical-trace.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_live_razzball_numerical_trace.py"
      - ".github/workflows/live-razzball-numerical-trace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run numerical trace
        run: python scripts/run_live_razzball_numerical_trace.py
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-razzball-numerical-trace
          path: artifacts/diagnostics/live_razzball_numerical_trace_20260920/
