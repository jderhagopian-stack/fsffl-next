name: NEXT-3 Market Research

on:
  push:
    branches:
      - next-3-value
    paths:
      - 'scripts/build_next3_research_crosswalk.py'
      - 'scripts/build_next3_market_panel.py'
      - 'scripts/build_next3_statsguy_history.py'
      - 'scripts/benchmark_next3_market_sources.py'
      - 'src/fsffl/value/**'
      - '.github/workflows/next3-market-research.yml'
  workflow_dispatch:

jobs:
  build-market-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: pip install -e .
      - name: Build research identity crosswalk
        run: |
          mkdir -p .artifacts/next3
          python scripts/build_next3_research_crosswalk.py \
            --output .artifacts/next3/research_crosswalk.csv
      - name: Build concurrent three-source market panel
        run: |
          python scripts/build_next3_market_panel.py \
            --crosswalk .artifacts/next3/research_crosswalk.csv \
            --output .artifacts/next3/market_panel.json \
            --format-context-id dynasty:sf:12:half \
            --num-qbs 2 \
            --num-teams 12 \
            --ppr 0.5
      - name: Build weekly Stats Guy historical panel
        run: |
          python scripts/build_next3_statsguy_history.py \
            --crosswalk .artifacts/next3/research_crosswalk.csv \
            --output .artifacts/next3/statsguy_history.json \
            --start-date 2025-09-01 \
            --step-days 7 \
            --format sf_dynasty \
            --format-context-id dynasty:sf
      - name: Benchmark source agreement
        run: |
          python scripts/benchmark_next3_market_sources.py \
            --panel .artifacts/next3/market_panel.json \
            --output .artifacts/next3/source_benchmark.json
      - name: Summarize artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          panel = json.loads(Path('.artifacts/next3/market_panel.json').read_text())
          history = json.loads(Path('.artifacts/next3/statsguy_history.json').read_text())
          benchmark = json.loads(Path('.artifacts/next3/source_benchmark.json').read_text())
          history_dates = sorted({row['observed_at'][:10] for row in history['observations']})
          print('NEXT-3 market panel observations:', len(panel['observations']))
          print('By source:', benchmark['source_observation_counts'])
          print('Panel as_of:', panel['as_of'])
          print('Stats Guy history snapshots:', len(history_dates), 'first=', history_dates[0], 'last=', history_dates[-1])
          for pair in benchmark['pairwise_exact']:
              print('Exact pairwise:', pair)
          for pair in benchmark['pairwise_family']:
              print('Family pairwise:', pair)
          PY
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next3-market-research-${{ github.sha }}
          path: |
            .artifacts/next3/market_panel.json
            .artifacts/next3/research_crosswalk.csv
            .artifacts/next3/source_benchmark.json
            .artifacts/next3/statsguy_history.json
          retention-days: 7
