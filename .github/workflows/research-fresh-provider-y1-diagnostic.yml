name: Research fresh provider Y1 pipeline diagnostic

on:
  push:
    branches:
      - research/future-state-resolution-phase34-resume
    paths:
      - artifacts/research/production_resolution/fresh_provider_capture_y1_pipeline_diagnostic_20260919/TRIGGER_CAPTURE.txt

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          ref: research/future-state-resolution-phase34-resume
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository runtime
        run: python -m pip install -e .
      - name: Run one fresh provider capture diagnostic
        run: |
          OUT="artifacts/research/production_resolution/fresh_provider_capture_y1_pipeline_diagnostic_20260919/capture_${GITHUB_RUN_ID}"
          python scripts/run_fresh_y1_provider_capture_audit.py --output-dir "$OUT"
          echo "FSFFL_CAPTURE_OUT=$OUT" >> "$GITHUB_ENV"
      - name: Verify bounded output
        run: |
          test -f "$FSFFL_CAPTURE_OUT/CAPTURE_MANIFEST.json"
          test -f "$FSFFL_CAPTURE_OUT/provider_capture/fftoday_parsed_rows.json"
          test -f "$FSFFL_CAPTURE_OUT/provider_capture/razzball_parsed_rows.json"
          test -f "$FSFFL_CAPTURE_OUT/normalized/fftoday_pre_ensemble_normalized.json"
          test -f "$FSFFL_CAPTURE_OUT/normalized/razzball_pre_ensemble_normalized.json"
          test -f "$FSFFL_CAPTURE_OUT/fresh_equal_weight_ensemble.json"
          test -f "$FSFFL_CAPTURE_OUT/fresh_league_scored_y1.json"
          cat "$FSFFL_CAPTURE_OUT/CAPTURE_SUMMARY.json"
      - name: Upload diagnostic capture
        uses: actions/upload-artifact@v4
        with:
          name: fresh-provider-y1-pipeline-diagnostic-${{ github.run_id }}
          path: ${{ env.FSFFL_CAPTURE_OUT }}/**
          retention-days: 14
          if-no-files-found: error
      - name: Persist fresh diagnostic evidence on research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FSFFL_CAPTURE_OUT"
          git commit -m "research: persist fresh Y1 provider pipeline capture ${GITHUB_RUN_ID}"
          git push origin HEAD:research/future-state-resolution-phase34-resume
