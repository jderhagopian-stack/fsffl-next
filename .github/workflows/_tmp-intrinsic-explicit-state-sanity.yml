name: Temporary Intrinsic Explicit-State Sanity

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_intrinsic_explicit_state_sanity.py'
      - 'scripts/run_intrinsic_explicit_state_sanity_cached.py'
      - '.github/workflows/_tmp-intrinsic-explicit-state-sanity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Build PIT football career panel
        run: Rscript scripts/extract_career_transition_panel.R
      - name: Download frozen PIT Forecast evidence
        run: |
          mkdir -p artifacts/explicit-state-sanity/frozen-pr131 artifacts/explicit-state-sanity/frozen-qb
          gh api repos/${{ github.repository }}/actions/artifacts/10318004415/zip > /tmp/pr131.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10317272576/zip > /tmp/qb.zip
          unzip -q /tmp/pr131.zip -d artifacts/explicit-state-sanity/frozen-pr131
          unzip -q /tmp/qb.zip -d artifacts/explicit-state-sanity/frozen-qb
      - name: Run current, synthetic, format and runtime sanity
        run: |
          python scripts/run_intrinsic_explicit_state_sanity_cached.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/explicit-state-sanity/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/explicit-state-sanity/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/explicit-state-sanity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intrinsic-explicit-state-sanity
          path: artifacts/explicit-state-sanity/*.json
          retention-days: 14
