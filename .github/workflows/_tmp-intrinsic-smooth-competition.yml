name: Temporary Intrinsic Smooth Primitive Competition

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_intrinsic_smooth_candidate.py'
      - 'scripts/summarize_intrinsic_smooth_competition.py'
      - '.github/workflows/_tmp-intrinsic-smooth-competition.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compete:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Build PIT football career panel
        run: Rscript scripts/extract_career_transition_panel.R
      - name: Download frozen PIT Forecast evidence
        run: |
          mkdir -p artifacts/smooth/frozen-pr131 artifacts/smooth/frozen-qb
          gh api repos/${{ github.repository }}/actions/artifacts/10318004415/zip > /tmp/pr131.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10317272576/zip > /tmp/qb.zip
          unzip -q /tmp/pr131.zip -d artifacts/smooth/frozen-pr131
          unzip -q /tmp/qb.zip -d artifacts/smooth/frozen-qb
      - name: Run hard marginal comparator B
        run: |
          mkdir -p artifacts/smooth/hard
          python scripts/run_intrinsic_marginal_franchise_challenge_fixed.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/smooth/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/smooth/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/smooth/hard
      - name: Run smooth C1 softplus
        run: |
          mkdir -p artifacts/smooth/C1_softplus
          python scripts/run_intrinsic_smooth_candidate.py --form C1_softplus \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/smooth/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/smooth/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/smooth/C1_softplus
      - name: Run smooth C2 Jeffreys supply integral
        run: |
          mkdir -p artifacts/smooth/C2_jeffreys_supply_integral
          python scripts/run_intrinsic_smooth_candidate.py --form C2_jeffreys_supply_integral \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/smooth/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/smooth/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/smooth/C2_jeffreys_supply_integral
      - name: Run smooth C3 utilization
        run: |
          mkdir -p artifacts/smooth/C3_smooth_utilization
          python scripts/run_intrinsic_smooth_candidate.py --form C3_smooth_utilization \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/smooth/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/smooth/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/smooth/C3_smooth_utilization
      - name: Select smooth challenger from governed evidence
        run: |
          python scripts/summarize_intrinsic_smooth_competition.py \
            --root artifacts/smooth \
            --output artifacts/smooth/intrinsic_smooth_competition.json
      - name: Upload competition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intrinsic-smooth-competition
          path: |
            artifacts/smooth/**/*.json
            artifacts/smooth/intrinsic_smooth_competition.json
            artifacts/next2-career/career_transition_coverage.csv
          retention-days: 14
