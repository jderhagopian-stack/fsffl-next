name: Prospective ROS and Event Research Capture
on:
  schedule:
    - cron: '20 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/capture_prospective_ros_event_snapshot.py
      - .github/workflows/prospective-ros-event-capture.yml

permissions:
  contents: read
  id-token: write

env:
  NFLREADPY_CACHE: filesystem
  NFLREADPY_CACHE_DURATION: '86400'
  NFLREADPY_TIMEOUT: '180'
  NFLREADPY_VERBOSE: 'False'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: c12402df1b7fa0bfbb3d994bdcf791d80e103a0c
          path: research_ref
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install capture dependencies
        run: python -m pip install -e . pandas numpy nflreadpy pyarrow
      - name: Build normalized private research payload
        run: |
          python scripts/capture_prospective_ros_event_snapshot.py \
            --research-root research_ref \
            --board artifacts/implementation/final_forecast_route_implementation_20260920/FINAL_STANDARD_COORDINATE_BOARD_335.csv \
            --output /tmp/fsffl_ros_event_capture.json
      - name: Persist through GitHub OIDC to private research archive
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fsffl-supabase-ros-archive")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${TOKEN_RESPONSE}")"
          echo "::add-mask::${TOKEN}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fsffl_ros_event_capture.json \
            https://gldxkbqcprzuffgmamxl.supabase.co/functions/v1/fsffl-research-snapshot-ingest \
            | python -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=2, sort_keys=True))'
          rm -f /tmp/fsffl_ros_event_capture.json
