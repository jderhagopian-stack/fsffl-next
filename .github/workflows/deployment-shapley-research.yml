name: Research Deployment Shapley Intrinsic

on:
  pull_request:
    branches: [phase3/fundamental-intrinsic-value]
    paths:
      - 'scripts/run_deployment_shapley_intrinsic_research.py'
      - 'scripts/_deployment_shapley_parts/**'
      - '.github/workflows/deployment-shapley-research.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Build PIT football career panel
        run: Rscript scripts/extract_career_transition_panel.R
      - name: Download frozen PIT Forecast evidence
        run: |
          mkdir -p artifacts/deployment-shapley/frozen-pr131 artifacts/deployment-shapley/frozen-qb
          gh api repos/${{ github.repository }}/actions/artifacts/10318004415/zip > /tmp/pr131.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10317272576/zip > /tmp/qb.zip
          unzip -q /tmp/pr131.zip -d artifacts/deployment-shapley/frozen-pr131
          unzip -q /tmp/qb.zip -d artifacts/deployment-shapley/frozen-qb
      - name: Recreate frozen variance-orthogonal central benchmark rows
        env:
          FSFFL_CONDITIONAL_D2_VARIANT: central
        run: |
          mkdir -p artifacts/deployment-shapley/central
          python scripts/run_intrinsic_explicit_state_conditional_quality.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/deployment-shapley/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/deployment-shapley/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/deployment-shapley/central
      - name: Run bounded deployment Shapley research
        run: |
          mkdir -p artifacts/deployment-shapley/results
          python scripts/run_deployment_shapley_intrinsic_research.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/deployment-shapley/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/deployment-shapley/frozen-qb/qb_career_state_deployment_results.json \
            --central-rows artifacts/deployment-shapley/central/explicit_state_validation_rows.json \
            --output-dir artifacts/deployment-shapley/results
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-shapley-research
          path: |
            artifacts/deployment-shapley/results/*.json
            artifacts/deployment-shapley/central/*.json
            artifacts/next2-career/career_transition_coverage.csv
          retention-days: 14
