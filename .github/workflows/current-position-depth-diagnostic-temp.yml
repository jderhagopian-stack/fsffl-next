name: Current Position Depth diagnostic temporary

on:
  push:
    branches:
      - work/current-position-depth-correction-20261006

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev,web]'
      - name: Simulation replay alone
        run: pytest -q tests/test_simulation_hot_loop_equivalence.py::test_50000_run_output_matches_governed_settings_derived_postseason_baseline
      - name: Current tests then Simulation replay in same process
        run: >
          pytest -q
          tests/test_current_position_depth.py
          tests/test_simulation_hot_loop_equivalence.py::test_50000_run_output_matches_governed_settings_derived_postseason_baseline
      - name: Changed Current and Atlas tests then Simulation replay
        run: >
          pytest -q
          tests/test_current_position_depth.py
          tests/test_in_season_forecast.py
          tests/test_product_contextual_information.py
          tests/test_product_league_position_strength.py
          tests/test_product_league_comparison_static.py
          tests/test_product_league_structure.py
          tests/test_phase3_league_surface.py
          tests/test_simulation_hot_loop_equivalence.py::test_50000_run_output_matches_governed_settings_derived_postseason_baseline
