name: Current Position Depth diagnostic temporary

on:
  push:
    branches:
      - work/current-position-depth-correction-20261006

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev,web]'
      - name: Replay with hash seed 0
        env:
          PYTHONHASHSEED: "0"
        run: pytest -q tests/test_simulation_hot_loop_equivalence.py::test_50000_run_output_matches_governed_settings_derived_postseason_baseline
      - name: Replay with hash seed 1
        env:
          PYTHONHASHSEED: "1"
        run: pytest -q tests/test_simulation_hot_loop_equivalence.py::test_50000_run_output_matches_governed_settings_derived_postseason_baseline
      - name: Replay with hash seed 2
        env:
          PYTHONHASHSEED: "2"
        run: pytest -q tests/test_simulation_hot_loop_equivalence.py::test_50000_run_output_matches_governed_settings_derived_postseason_baseline
      - name: Replay with hash seed 3
        env:
          PYTHONHASHSEED: "3"
        run: pytest -q tests/test_simulation_hot_loop_equivalence.py::test_50000_run_output_matches_governed_settings_derived_postseason_baseline
