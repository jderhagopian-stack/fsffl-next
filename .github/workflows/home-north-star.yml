name: Home North Star focused validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/fsffl/product/webapp.py"
      - "src/fsffl/product/persistent_webapp.py"
      - "src/fsffl/product/static/home_dashboard.js"
      - "src/fsffl/product/static/product_shell.js"
      - "src/fsffl/product/static/league_comparison.js"
      - "src/fsffl/product/static/opportunities.js"
      - "src/fsffl/product/static/index.html"
      - "tests/test_product_home_experience.py"
      - "tests/test_phase3_home_governed_opportunity.py"
      - "tests/test_home_north_star_api.py"
      - "tests/test_phase3_product_architecture_navigation.py"
      - "scripts/run_home_north_star_sanity.py"
      - "docs/HOME_NORTH_STAR_REAL_LEAGUE_ACCEPTANCE_20260923.md"
      - ".github/workflows/home-north-star.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FSFFL_DATABASE_URL: ${{ secrets.FSFFL_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev,web]'
      - name: Check Home and contextual-navigation JavaScript
        run: |
          node --check src/fsffl/product/static/home_dashboard.js
          node --check src/fsffl/product/static/product_shell.js
          node --check src/fsffl/product/static/league_comparison.js
          node --check src/fsffl/product/static/opportunities.js
      - name: Focused Home and destination regressions
        run: >
          pytest -q
          tests/test_product_home_experience.py
          tests/test_phase3_home_governed_opportunity.py
          tests/test_home_north_star_api.py
          tests/test_phase3_product_architecture_navigation.py
          tests/test_product_full_navigation_shell.py
          tests/test_product_post_load_freeze_regression.py
          tests/test_product_league_comparison_static.py
          tests/test_product_opportunity_workspace.py
      - name: Check production-persistence access
        id: persistence
        shell: bash
        run: |
          mkdir -p artifacts/diagnostics/home_north_star_20260923
          if [ -z "$FSFFL_DATABASE_URL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            cp docs/HOME_NORTH_STAR_REAL_LEAGUE_ACCEPTANCE_20260923.md artifacts/diagnostics/home_north_star_20260923/EXACT_REAL_LEAGUE_ACCEPTANCE.md
            cat > artifacts/diagnostics/home_north_star_20260923/CI_ENVIRONMENT_BOUNDARY.md <<'EOF'
          # CI environment boundary
          GitHub Actions does not expose FSFFL_DATABASE_URL for this repository.
          The exact real-league acceptance coordinate was verified pre-merge through
          the authorized production persistence connector and is checked in at
          docs/HOME_NORTH_STAR_REAL_LEAGUE_ACCEPTANCE_20260923.md.
          Deterministic Home/API/navigation regressions still run in this workflow.
          EOF
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Real-league Home truth sanity
        if: steps.persistence.outputs.available == 'true'
        run: python scripts/run_home_north_star_sanity.py
      - name: Upload Home sanity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-north-star-sanity
          path: artifacts/diagnostics/home_north_star_20260923/
          if-no-files-found: error
