name: Temporary Render acceptance keep-awake

on:
  push:
    paths:
      - ".github/workflows/temporary-render-acceptance-keepalive.yml"
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Keep Render awake during hosted acceptance
        shell: bash
        run: |
          set -u
          for i in $(seq 1 20); do
            code="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 https://fsffl-next-private-beta.onrender.com/ || true)"
            echo "$(date -u +%FT%TZ) ping=$i status=$code"
            sleep 120
          done
