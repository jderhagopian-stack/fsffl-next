name: Research Live Forecast Horizon

on:
  pull_request:
    branches: [research/regularization-developmental-calibration]
    paths:
      - 'scripts/run_live_forecast_horizon_research.py'
      - 'artifacts/research/live_forecast_time_coordinate_protocol.md'
      - 'artifacts/research/live_forecast_horizon_selection_freeze.json'
      - '.github/workflows/live-forecast-horizon-research.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research tooling
        run: python -m pip install -e . pandas numpy scikit-learn nflreadpy pyarrow
      - name: Build strict-PIT source panels
        run: |
          Rscript scripts/extract_career_transition_panel.R
          Rscript scripts/extract_forecast_usage_panel.R
      - name: Run predeclared rolling h1/h2/h3 selection study
        run: |
          mkdir -p artifacts/live-forecast-horizon/selection
          python scripts/run_live_forecast_horizon_research.py \
            --mode selection \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --usage-panel artifacts/forecast-disappearance/final/forecast_usage_panel.csv \
            --output-dir artifacts/live-forecast-horizon/selection
      - name: Confirm untouched fold remains gated
        run: |
          if [ -f artifacts/research/live_forecast_horizon_selection_freeze.json ]; then
            echo 'A selection freeze exists, but this workflow intentionally does not run confirmation.'
          else
            echo 'No selection freeze yet; source-2021 -> target-2024 remains untouched.'
          fi
      - name: Upload selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-forecast-horizon-selection
          path: |
            artifacts/live-forecast-horizon/selection/*
            artifacts/research/live_forecast_time_coordinate_protocol.md
          if-no-files-found: warn
          retention-days: 14
