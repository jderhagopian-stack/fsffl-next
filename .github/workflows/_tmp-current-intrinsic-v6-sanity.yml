name: Temporary Current Intrinsic v6 Sanity
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_tmp_current_intrinsic_v6_sanity.py'
      - '.github/workflows/_tmp-current-intrinsic-v6-sanity.yml'
      - 'src/fsffl/value/intrinsic_v2.py'
      - 'src/fsffl/value/intrinsic_economics.py'
permissions:
  contents: read
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/_tmp_current_intrinsic_v6_sanity.py
