name: Value authority comparison audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[web]'
      - name: Run Broad Market / Shapley comparison
        run: python scripts/run_value_authority_comparison_audit.py
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-authority-comparison-audit
          path: |
            artifacts/diagnostics/forecast_value_reconciliation_20260920/MARKET_SHAPLEY_REAL_PLAYER_COMPARISON.csv
            artifacts/diagnostics/forecast_value_reconciliation_20260920/MARKET_SHAPLEY_NAMED_SAMPLE.csv
            artifacts/diagnostics/forecast_value_reconciliation_20260920/MARKET_SHAPLEY_COMPARISON_MANIFEST.json
          if-no-files-found: error
