name: Research Integrated Forecast Shapley Constitution

on:
  pull_request:
    branches: [research/persistence-first-forecast-calibration]
    paths:
      - 'scripts/run_integrated_forecast_shapley_downstream.py'
      - '.github/workflows/integrated-forecast-shapley-constitution.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-downstream-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research tooling
        run: python -m pip install -e . pandas scikit-learn nflreadpy pyarrow
      - name: Build frozen PIT career panel
        run: Rscript scripts/extract_career_transition_panel.R
      - name: Build strict-PIT usage panel
        run: Rscript scripts/extract_forecast_usage_panel.R
      - name: Download frozen authoritative research evidence
        run: |
          mkdir -p artifacts/integrated-downstream/frozen/model-a \
                   artifacts/integrated-downstream/frozen/qb \
                   artifacts/integrated-downstream/frozen/forecast \
                   artifacts/integrated-downstream/frozen/event \
                   artifacts/integrated-downstream/frozen/persistence \
                   artifacts/integrated-downstream/frozen/integrated \
                   artifacts/integrated-downstream/frozen/decomp
          gh api repos/${{ github.repository }}/actions/artifacts/10318004415/zip > /tmp/model-a.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10317272576/zip > /tmp/qb.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10408705946/zip > /tmp/forecast.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10416382295/zip > /tmp/event.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10419402765/zip > /tmp/persistence.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10422596781/zip > /tmp/integrated.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10382432938/zip > /tmp/decomp.zip
          unzip -q /tmp/model-a.zip -d artifacts/integrated-downstream/frozen/model-a
          unzip -q /tmp/qb.zip -d artifacts/integrated-downstream/frozen/qb
          unzip -q /tmp/forecast.zip -d artifacts/integrated-downstream/frozen/forecast
          unzip -q /tmp/event.zip -d artifacts/integrated-downstream/frozen/event
          unzip -q /tmp/persistence.zip -d artifacts/integrated-downstream/frozen/persistence
          unzip -q /tmp/integrated.zip -d artifacts/integrated-downstream/frozen/integrated
          unzip -q /tmp/decomp.zip -d artifacts/integrated-downstream/frozen/decomp
      - name: Re-run locked 10-point Intrinsic Constitution
        run: |
          mkdir -p artifacts/integrated-downstream/results
          python scripts/run_intrinsic_constitution_shapley_validation_v2.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --decomp-rows artifacts/integrated-downstream/frozen/decomp/shapley-decomp/results/shapley_target_decomposition_rows.json \
            --output artifacts/integrated-downstream/results/intrinsic_constitution_shapley_validation.json
      - name: Run frozen 2048-permutation integrated Forecast Shapley diagnostic
        run: |
          python scripts/run_integrated_forecast_shapley_downstream.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --usage-panel artifacts/forecast-disappearance/final/forecast_usage_panel.csv \
            --model-a-rows artifacts/integrated-downstream/frozen/model-a/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/integrated-downstream/frozen/qb/qb_career_state_deployment_results.json \
            --prior-forecast-json artifacts/integrated-downstream/frozen/forecast/forecast-disappearance/final/forecast_disappearance_development_results.json \
            --prior-event-json artifacts/integrated-downstream/frozen/event/event-time/results/event_time_absence_cause_results.json \
            --prior-persistence-json artifacts/integrated-downstream/frozen/persistence/persistence-first/results/persistence_first_forecast_calibration_results.json \
            --integrated-results artifacts/integrated-downstream/frozen/integrated/integrated-multivariate/results/integrated_multivariate_forecast_results.json \
            --prior-decomp-rows artifacts/integrated-downstream/frozen/decomp/shapley-decomp/results/shapley_target_decomposition_rows.json \
            --constitution-json artifacts/integrated-downstream/results/intrinsic_constitution_shapley_validation.json \
            --output-dir artifacts/integrated-downstream/results
      - name: Upload integrated downstream evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-forecast-shapley-constitution
          path: |
            artifacts/integrated-downstream/results/*.json
            artifacts/research/integrated_multivariate_forecast_protocol.md
            artifacts/research/intrinsic_constitution_shapley_test_plan.md
          retention-days: 14
