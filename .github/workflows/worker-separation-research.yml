name: Worker separation research (nonproduction)

on:
  pull_request:
    paths:
      - 'src/fsffl/product/worker_handoff.py'
      - 'db/migrations/20261028_012_intelligence_worker_job_handoff.sql'
      - 'tests/test_worker_handoff.py'
      - 'tests/test_worker_handoff_postgres.py'
      - '.github/workflows/worker-separation-research.yml'

permissions:
  contents: read

concurrency:
  group: worker-separation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lease-and-state-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: worker_test
          POSTGRES_DB: fsffl_worker_test
          POSTGRES_PASSWORD: research_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U worker_test -d fsffl_worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FSFFL_TEST_WORKER_DB: postgresql://worker_test:research_only@127.0.0.1:5432/fsffl_worker_test
      FSFFL_WORKER_DESTRUCTIVE_TEST_ALLOWED: '1'
      FSFFL_BETA_AUTH: '0'
      FSFFL_DATABASE_URL: ''
    steps:
      - name: Checkout exact implementation candidate
        uses: actions/checkout@v4
      - name: Install production Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install project with existing pooled PostgreSQL transport
        run: python -m pip install -e '.[dev,web]'
      - name: Run deterministic handoff and real isolated PostgreSQL lease/recovery tests
        run: python -m pytest -q tests/test_worker_handoff.py tests/test_worker_handoff_postgres.py