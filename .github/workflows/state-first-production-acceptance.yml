name: State-first production acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_state_first_production_acceptance.py'
      - '.github/workflows/state-first-production-acceptance.yml'
      - 'src/fsffl/product/hosted_connect.py'
      - 'src/fsffl/product/persistent_runtime.py'
      - 'src/fsffl/product/persistent_webapp.py'
      - 'src/fsffl/product/runtime.py'
      - 'src/fsffl/product/webapp.py'
      - 'src/fsffl/persistence/session.py'
  workflow_dispatch:

concurrency:
  group: state-first-production-acceptance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FSFFL_DATABASE_URL: ${{ secrets.FSFFL_DATABASE_URL }}
      FSFFL_ACCEPTANCE_USER: state-first-acceptance-${{ github.run_id }}
      FSFFL_ACCEPTANCE_CONNECT_TIMEOUT: '240'
      FSFFL_ACCEPTANCE_INTELLIGENCE_TIMEOUT: '1200'
      FSFFL_ACCEPTANCE_POLL_SECONDS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hosted private-beta package
        run: python -m pip install -e '.[web]'
      - name: Verify production persistence secret
        run: |
          python - <<'PY'
          import os
          if not os.getenv("FSFFL_DATABASE_URL", "").strip():
              raise SystemExit("FSFFL_DATABASE_URL is unavailable; production acceptance cannot run")
          print("production persistence configured")
          PY
      - name: Run real-league State-first switch and refresh acceptance
        run: python scripts/run_state_first_production_acceptance.py
      - name: Upload State-first production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-first-production-acceptance
          path: |
            artifacts/implementation/state_first_production_acceptance.json
            artifacts/implementation/state_first_production_acceptance.md
          if-no-files-found: warn
          retention-days: 14
