name: Research Live Forecast Horizon Confirmation

on:
  pull_request:
    branches: [research/regularization-developmental-calibration]
    paths:
      - 'artifacts/research/live_forecast_horizon_selection_freeze.json'
      - '.github/workflows/live-forecast-horizon-confirmation.yml'
      - 'scripts/run_live_forecast_horizon_research.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Enforce pre-results selection freeze
        id: gate
        run: |
          if [ ! -f artifacts/research/live_forecast_horizon_selection_freeze.json ]; then
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
            echo 'Selection is not frozen; source-2021 -> target-2024 remains untouched.'
            exit 0
          fi
          python - <<'PY'
          import json
          d=json.load(open('artifacts/research/live_forecast_horizon_selection_freeze.json'))
          if not d.get('selection_frozen'):
              raise SystemExit('selection_frozen is not true')
          if d.get('confirmation_accessed'):
              raise SystemExit('freeze artifact says confirmation was already accessed before this run')
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@v2
        if: steps.gate.outputs.authorized == 'true'
        with:
          r-version: release
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.authorized == 'true'
        with:
          python-version: '3.11'
      - name: Install research tooling
        if: steps.gate.outputs.authorized == 'true'
        run: python -m pip install -e . pandas numpy scikit-learn nflreadpy pyarrow
      - name: Build strict-PIT source panels
        if: steps.gate.outputs.authorized == 'true'
        run: |
          Rscript scripts/extract_career_transition_panel.R
          Rscript scripts/extract_forecast_usage_panel.R
      - name: Run untouched source-2021 to target-2024 confirmation
        if: steps.gate.outputs.authorized == 'true'
        run: |
          mkdir -p artifacts/live-forecast-horizon/confirmation
          python scripts/run_live_forecast_horizon_research.py \
            --mode confirmation \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --usage-panel artifacts/forecast-disappearance/final/forecast_usage_panel.csv \
            --output-dir artifacts/live-forecast-horizon/confirmation
      - name: Upload untouched confirmation evidence
        if: steps.gate.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-forecast-horizon-confirmation
          path: |
            artifacts/live-forecast-horizon/confirmation/*
            artifacts/research/live_forecast_horizon_selection_freeze.json
          if-no-files-found: error
          retention-days: 14
