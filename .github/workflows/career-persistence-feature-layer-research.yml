name: Career Persistence Feature Layer Research

on:
  workflow_dispatch:
  push:
    branches: [research/multiyear-intrinsic-value-study]
    paths:
      - 'scripts/run_career_persistence_feature_layer_research.py'
      - 'scripts/extract_career_transition_panel.R'
      - '.github/workflows/career-persistence-feature-layer-research.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract governed career transition panel
        run: Rscript scripts/extract_career_transition_panel.R
      - name: Install research dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Run career-persistence feature research
        run: |
          python scripts/run_career_persistence_feature_layer_research.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --output-dir artifacts/career-persistence
      - name: Verify repository tests
        run: |
          python -m pip install -e '.[dev,web]'
          python -m pytest -q
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-persistence-feature-layer-research
          path: |
            artifacts/career-persistence/career_persistence_results.json
            artifacts/career-persistence/career_persistence_report.md
            artifacts/career-persistence/career_persistence_derived_features.csv
            artifacts/next2-career/career_transition_coverage.csv
          retention-days: 14
