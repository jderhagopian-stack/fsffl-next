name: Research persist governed Year-1 universe

on:
  push:
    branches:
      - research/future-state-resolution-phase34-resume
    paths:
      - '.github/workflows/research-persist-governed-year1-universe.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the already-completed data refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/fsffl-year1-frozen
          mkdir -p /tmp/fsffl-year1-frozen
          gh run download 35330898624 --repo "$GITHUB_REPOSITORY" --name governed-year1-evaluation-universe --dir /tmp/fsffl-year1-frozen

      - name: Verify and stage the exact frozen coordinate
        run: |
          python scripts/research_persist_frozen_year1_universe.py             --source-dir /tmp/fsffl-year1-frozen             --dest-dir artifacts/research/production_resolution/governed_year1_current_2026_20260918T094231Z

      - name: Commit the durable coordinate to the research branch
        run: |
          git config user.name "fsffl-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/research/production_resolution/governed_year1_current_2026_20260918T094231Z
          git diff --cached --stat
          git commit -m "research: persist governed Year-1 evaluation universe"
          git push origin "HEAD:${GITHUB_REF_NAME}"
