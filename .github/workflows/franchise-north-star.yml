name: Franchise North Star focused validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/fsffl/product/static/my_team_dashboard.js"
      - "src/fsffl/product/static/product_shell.js"
      - "src/fsffl/product/static/my_team_diagnostics.js"
      - "tests/test_product_my_team_command_center.py"
      - "tests/test_product_my_team_diagnostics.py"
      - "tests/test_player_intelligence_static.py"
      - "tests/test_phase3_product_architecture_navigation.py"
      - "tests/test_product_full_navigation_shell.py"
      - ".github/workflows/franchise-north-star.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev,web]'
      - name: Check Franchise JavaScript
        run: |
          node --check src/fsffl/product/static/my_team_dashboard.js
          node --check src/fsffl/product/static/product_shell.js
          node --check src/fsffl/product/static/player_intelligence.js
      - name: Focused Franchise and drill-down regressions
        run: >
          pytest -q
          tests/test_product_my_team_command_center.py
          tests/test_product_my_team_diagnostics.py
          tests/test_player_intelligence_static.py
          tests/test_phase3_product_architecture_navigation.py
          tests/test_product_full_navigation_shell.py
