name: Research freeze governed Year-1 universe

on:
  push:
    branches:
      - research/future-state-resolution-phase34-resume
    paths:
      - 'scripts/research_freeze_governed_year1_universe.py'
      - '.github/workflows/research-freeze-governed-year1-universe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository runtime
        run: python -m pip install -e '.[web]'

      - name: Freeze governed current Year-1 universe
        run: |
          python scripts/research_freeze_governed_year1_universe.py             --output-dir /tmp/fsffl-governed-year1

      - name: Show bounded result
        if: always()
        run: |
          find /tmp/fsffl-governed-year1 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          cat /tmp/fsffl-governed-year1/report.md 2>/dev/null || true
          cat /tmp/fsffl-governed-year1/blocker.json 2>/dev/null || true

      - name: Upload row-complete recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-year1-evaluation-universe
          path: /tmp/fsffl-governed-year1/*
          if-no-files-found: error
          retention-days: 14
