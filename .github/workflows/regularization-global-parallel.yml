name: Research Regularization Global C Parallel

on:
  pull_request:
    branches: [research/integrated-multivariate-forecast]
    paths:
      - 'scripts/run_regularization_single_c.py'
      - '.github/workflows/regularization-global-parallel.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research tooling
        run: python -m pip install -e . pandas scikit-learn nflreadpy pyarrow
      - name: Build one shared strict-PIT evidence bundle
        run: |
          Rscript scripts/extract_career_transition_panel.R
          Rscript scripts/extract_forecast_usage_panel.R
          mkdir -p artifacts/regularization-parallel/frozen/qb \
                   artifacts/regularization-parallel/frozen/event \
                   artifacts/regularization-parallel/frozen/persistence \
                   artifacts/regularization-parallel/frozen/integrated
          gh api repos/${{ github.repository }}/actions/artifacts/10317272576/zip > /tmp/qb.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10416382295/zip > /tmp/event.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10419402765/zip > /tmp/persistence.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10422858437/zip > /tmp/integrated.zip
          unzip -q /tmp/qb.zip -d artifacts/regularization-parallel/frozen/qb
          unzip -q /tmp/event.zip -d artifacts/regularization-parallel/frozen/event
          unzip -q /tmp/persistence.zip -d artifacts/regularization-parallel/frozen/persistence
          unzip -q /tmp/integrated.zip -d artifacts/regularization-parallel/frozen/integrated
      - uses: actions/upload-artifact@v4
        with:
          name: regularization-shared-inputs
          path: |
            artifacts/next2-career/career_transition_panel.csv
            artifacts/forecast-disappearance/final/forecast_usage_panel.csv
            artifacts/regularization-parallel/frozen/qb/qb_career_state_deployment_results.json
            artifacts/regularization-parallel/frozen/event/event-time/results/event_time_absence_cause_results.json
            artifacts/regularization-parallel/frozen/persistence/persistence-first/results/persistence_first_forecast_calibration_results.json
            artifacts/regularization-parallel/frozen/integrated/integrated-multivariate/results/integrated_multivariate_forecast_results.json
          retention-days: 14

  global-c:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        C: ['0.0625', '0.125', '0.25', '0.5', '1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research tooling
        run: python -m pip install -e . pandas scikit-learn
      - uses: actions/download-artifact@v4
        with:
          name: regularization-shared-inputs
          path: artifacts/shared
      - name: Run one frozen C across all rolling folds
        run: |
          mkdir -p artifacts/regularization-parallel/results
          python scripts/run_regularization_single_c.py \
            --C '${{ matrix.C }}' \
            --career-panel artifacts/shared/artifacts/next2-career/career_transition_panel.csv \
            --usage-panel artifacts/shared/artifacts/forecast-disappearance/final/forecast_usage_panel.csv \
            --qb-results artifacts/shared/artifacts/regularization-parallel/frozen/qb/qb_career_state_deployment_results.json \
            --prior-integrated-json artifacts/shared/artifacts/regularization-parallel/frozen/integrated/integrated-multivariate/results/integrated_multivariate_forecast_results.json \
            --prior-event-json artifacts/shared/artifacts/regularization-parallel/frozen/event/event-time/results/event_time_absence_cause_results.json \
            --prior-persistence-json artifacts/shared/artifacts/regularization-parallel/frozen/persistence/persistence-first/results/persistence_first_forecast_calibration_results.json \
            --output-dir artifacts/regularization-parallel/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regularization-global-C-${{ matrix.C }}
          path: artifacts/regularization-parallel/results/*
          if-no-files-found: warn
          retention-days: 14
