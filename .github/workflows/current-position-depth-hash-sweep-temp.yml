name: Current Position Depth hash sweep temporary

on:
  push:
    branches:
      - work/current-position-depth-correction-20261006

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev,web]'
      - name: Sweep replay hash seeds 0 through 31
        run: |
          for seed in $(seq 0 31); do
            echo "PYTHONHASHSEED=$seed"
            PYTHONHASHSEED="$seed" pytest -q tests/test_simulation_hot_loop_equivalence.py::test_50000_run_output_matches_governed_settings_derived_postseason_baseline
          done
