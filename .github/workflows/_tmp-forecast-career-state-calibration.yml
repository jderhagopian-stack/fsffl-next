name: Temporary Forecast Career-State Calibration

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_forecast_career_state_calibration.py'
      - 'scripts/run_forecast_career_state_strict_compare.py'
      - 'scripts/run_forecast_career_state_taxonomy_strict_audit.py'
      - 'scripts/run_forecast_career_state_current_sanity.py'
      - '.github/workflows/_tmp-forecast-career-state-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  calibrate-state:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Build PIT football career panel
        run: Rscript scripts/extract_career_transition_panel.R
      - name: Download frozen PIT Forecast evidence
        run: |
          mkdir -p artifacts/forecast-state/frozen-pr131 artifacts/forecast-state/frozen-qb
          gh api repos/${{ github.repository }}/actions/artifacts/10318004415/zip > /tmp/pr131.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10317272576/zip > /tmp/qb.zip
          unzip -q /tmp/pr131.zip -d artifacts/forecast-state/frozen-pr131
          unzip -q /tmp/qb.zip -d artifacts/forecast-state/frozen-qb
      - name: Calibrate Forecast career states and rerun frozen D2
        run: |
          python scripts/run_forecast_career_state_calibration.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/forecast-state/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/forecast-state/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/forecast-state
      - name: Compare repaired calibration on exact D2 population
        run: |
          python scripts/run_forecast_career_state_strict_compare.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/forecast-state/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/forecast-state/frozen-qb/qb_career_state_deployment_results.json \
            --calibration-json artifacts/forecast-state/forecast_career_state_calibration.json \
            --output-dir artifacts/forecast-state
      - name: Audit taxonomy directly in Forecast inference space
        run: |
          python scripts/run_forecast_career_state_taxonomy_strict_audit.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/forecast-state/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/forecast-state/frozen-qb/qb_career_state_deployment_results.json \
            --output-dir artifacts/forecast-state
      - name: Run repaired-state current D2 sanity
        run: |
          sed -i 's/baseline={k.value:v for k,v in base0.items()}/baseline=base0/' scripts/run_forecast_career_state_current_sanity.py
          python scripts/run_forecast_career_state_current_sanity.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --model-a-rows artifacts/forecast-state/frozen-pr131/multiyear-intrinsic-model-a/model_a_repair_point_in_time_rows.csv \
            --qb-results artifacts/forecast-state/frozen-qb/qb_career_state_deployment_results.json \
            --calibration-json artifacts/forecast-state/forecast_career_state_calibration.json \
            --output-dir artifacts/forecast-state
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-career-state-calibration
          path: |
            artifacts/forecast-state/*.json
            artifacts/next2-career/career_transition_coverage.csv
          retention-days: 14
