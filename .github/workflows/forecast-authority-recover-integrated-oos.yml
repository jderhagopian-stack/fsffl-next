name: Forecast Authority Recover Integrated OOS

on:
  push:
    branches: [research/forecast-model-authority-audit-20260927]
    paths:
      - scripts/run_integrated_artifact_symmetric_summary.py
      - .github/workflows/forecast-authority-recover-integrated-oos.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy scipy
      - name: Restore exact integrated OOS artifact
        run: |
          mkdir -p /tmp/integrated
          gh api repos/${{ github.repository }}/actions/artifacts/10422858437/zip > /tmp/integrated.zip
          unzip -oq /tmp/integrated.zip -d /tmp/integrated
          find /tmp/integrated -type f -maxdepth 6 -print
      - name: Symmetric comparison from exact OOS rows
        run: |
          ROWS=$(find /tmp/integrated -name integrated_multivariate_oos_rows.csv -print -quit)
          RESULT=$(find /tmp/integrated -name integrated_multivariate_forecast_results.json -print -quit)
          test -n "$ROWS"; test -n "$RESULT"
          python scripts/run_integrated_artifact_symmetric_summary.py \
            --rows "$ROWS" --result-json "$RESULT" \
            --output-dir artifacts/research/forecast_model_authority_audit_20260927/integrated
      - name: Persist compact integrated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/research/forecast_model_authority_audit_20260927/integrated/
          git commit -m "Research: persist exact integrated OOS symmetric comparison" || true
          git pull --rebase origin research/forecast-model-authority-audit-20260927
          git push origin HEAD:research/forecast-model-authority-audit-20260927
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-authority-integrated-oos
          path: artifacts/research/forecast_model_authority_audit_20260927/integrated/
          retention-days: 30
