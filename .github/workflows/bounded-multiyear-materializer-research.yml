name: Bounded Multi-Year Materializer Research

on:
  workflow_dispatch:
  push:
    branches: [research/bounded-multiyear-materializer-shadow]
    paths:
      - 'scripts/run_bounded_multiyear_forecast_materializer_research.py'
      - 'scripts/extract_career_transition_panel.R'
      - 'scripts/run_career_calibration.py'
      - 'scripts/run_multiyear_intrinsic_model_a_repair.py'
      - 'src/fsffl/forecast/career.py'
      - 'src/fsffl/forecast/career_calibration.py'
      - '.github/workflows/bounded-multiyear-materializer-research.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev,web]'
      - name: Extract historical career transition panel
        run: Rscript scripts/extract_career_transition_panel.R
      - name: Run frozen bounded materializer candidate
        run: |
          mkdir -p artifacts/bounded-multiyear-materializer
          python scripts/run_bounded_multiyear_forecast_materializer_research.py \
            --career-panel artifacts/next2-career/career_transition_panel.csv \
            --output-dir artifacts/bounded-multiyear-materializer
      - name: Verify repository tests
        run: python -m pytest -q
      - name: Upload bounded materializer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-multiyear-materializer-research
          path: |
            artifacts/bounded-multiyear-materializer/bounded_materializer_results.json
            artifacts/bounded-multiyear-materializer/bounded_materializer_report.md
            artifacts/bounded-multiyear-materializer/bounded_materializer_rows.csv
            artifacts/bounded-multiyear-materializer/bounded_materializer_fold_metrics.csv
            artifacts/next2-career/career_transition_coverage.csv
          retention-days: 14
