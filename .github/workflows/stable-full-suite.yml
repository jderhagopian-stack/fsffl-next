name: Stable full suite

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: read

# A new stable PR head supersedes any in-flight full-suite candidate.
concurrency:
  group: stable-full-suite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  full-suite:
    name: full-suite
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify PR head before testing
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          actual_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "$actual_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Stable suite SHA $EXPECTED_HEAD_SHA is not current PR head $actual_head"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,web]'
      - name: Stable-head full suite
        run: pytest -q
      - name: Verify PR head after testing
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          actual_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "$actual_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::PR head moved from tested SHA $EXPECTED_HEAD_SHA to $actual_head during the full suite"
            exit 1
          fi
